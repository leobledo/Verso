// Fetch every pasted link → fill each channel's lyrics. Progress shows on the Lyrics
// button (which reads "Load" while links are present). No separate Load button.
// Link i → canal i SIEMPRE: cada letra se aplica al canal de SU link (si mueves un link de
// fila mientras carga, la letra lo sigue). Maximo 4 canciones a la vez. Al terminar:
//  · los links que fallaron se reintentan uno por uno;
//  · los que solo consiguieron LRCLIB (sin [secciones]) se reintentan en Genius uno por uno,
//    para que un fallo pasajero (Cloudflare, red, extension ocupada) no deje el canal sin secciones.
// Si algo no sale de Genius, el estado dice por que (canal: motivo).
var _gRun=0, _gRunKey='';
function loadGenius(){
  var jobs=[];
  channels.forEach(function(ch,i){ var url=_gLinkOf(geniusLinks[i]); if(url) jobs.push({ i:i, ch:ch, url:url, err:'', done:false, src:'', why:'' }); });
  if(!jobs.length){ gStatus('No links to load','#c66'); return; }
  var runKey=jobs.map(function(j){ return j.i+'|'+j.url; }).join('\n');
  if(runKey===_gRunKey){ toast('Already loading these links…'); return; }   // doble clic en Load
  var run=++_gRun; _gRunKey=runKey;
  _gExtReset();   // si antes la extension no respondia, se vuelve a comprobar ahora
  var total=jobs.length, settled=0;
  function live(){ return run===_gRun; }
  function paint(){ var lbl=document.getElementById('dpLyrLbl'); if(lbl) lbl.textContent='Loading '+settled+'/'+total; setProgress(Math.max(0.03, settled/total)); }
  function apply(j, lyr){
    var idx=(_gLinkOf(geniusLinks[j.i])===j.url)?j.i:-1, k;
    if(idx<0){ for(k=0;k<geniusLinks.length;k++){ if(_gLinkOf(geniusLinks[k])===j.url){ idx=k; break; } } }
    var ch=idx>=0?channels[idx]:null; if(!ch) return false;
    ch.lyricsText=lyr; ch.lines=deriveLines(lyr); ch.loaded=ch.lines.length>0; ch.geniusUrl=j.url;
    if(ch.id===activeId){ lines=ch.lines.slice(); curLine=nextStampable(0); pendingId=null; renderLyricsFlow(); }
    var ta=document.querySelector('#detailsPanel [data-lyr-id="'+ch.id+'"]'); if(ta){ ta.value=ch.lyricsText; ta.classList.add('filled'); }
    return true;
  }
  function pass(list, conc, done){
    var next=0, active=0, failed=[];
    (function pump(){
      if(!live()) return;
      while(active<conc && next<list.length){
        (function(j){
          active++;
          fetchGeniusLyrics(j.url, function(err, lyr, src, why){
            active--;
            if(!live()) return;
            if(!err && lyr && apply(j, lyr)){ if(!j.done){ j.done=true; settled++; } j.src=src; j.why=why||''; gStatus(settled+'/'+total+' · ✓ '+j.ch.name+(src==='lrclib'?' (LRCLIB)':''), 'var(--bl)'); }
            else { j.err=err||'no lyrics found'; failed.push(j); }
            paint(); pump();
          });
        })(list[next++]);
      }
      if(!active && next>=list.length) done(failed);
    })();
  }
  function retryFailed(f1, next){
    if(!f1.length){ next([]); return; }
    gStatus('Retrying '+f1.length+'…', 'var(--bl)');
    setTimeout(function(){ if(!live()) return; f1.forEach(function(j){ j.err=''; }); pass(f1, 1, function(f2){ settled+=f2.length; paint(); next(f2); }); }, 1500);
  }
  function upgrade(next){   // LRCLIB → Genius, uno por uno (solo si hay una via a Genius: AE o extension)
    var lst=jobs.filter(function(j){ return j.done && j.src==='lrclib'; });
    if(!lst.length || !(IN_AE || _gExt===true)){ next(); return; }
    var i=0;
    (function step(){
      if(!live()) return;
      if(i>=lst.length){ next(); return; }
      var j=lst[i++]; gStatus('Genius [secciones] '+i+'/'+lst.length+' · '+j.ch.name+'…', 'var(--bl)');
      setTimeout(function(){
        if(!live()) return;
        fetchGeniusLyrics(j.url, function(err, lyr, src, why){
          if(!live()) return;
          if(!err && lyr && apply(j, lyr)){ j.src=src; j.why=''; } else if(why) j.why=why;
          step();
        }, null, { noLrc:true });
      }, 500);
    })();
  }
  function finish(failed){
    if(!live()) return;
    _gRunKey='';
    stopProgress(); renderChannels(); syncTitle();
    var lrc=jobs.filter(function(j){ return j.done && j.src==='lrclib'; }), okc=jobs.filter(function(j){ return j.done; }).length, hint=_gExtHint();
    var msg='✓ Genius lyrics: '+okc+'/'+total+(lrc.length?(' · '+lrc.length+' via LRCLIB (no [sections])'):'');
    var parts=[];
    if(failed.length) parts.push('✗ '+failed.map(function(j){ return j.ch.name+': '+j.err; }).join(' · '));
    if(lrc.length) parts.push('LRCLIB (sin [secciones]): '+lrc.map(function(j){ return j.ch.name+(j.why?(' ('+j.why+')'):''); }).join(' · '));
    if(hint && (failed.length || lrc.length)) parts.push('⚠ '+hint);
    if(parts.length){
      // Deja la seccion de links abierta con el detalle: "Load" reintenta (lo ya cargado de Genius sale de cache).
      var gb=document.getElementById('dpGlobalBar'); if(gb && !gb.classList.contains('genius-open')) toggleGeniusBulk();
      gStatus(parts.join(' — ')+' — press Load to retry', failed.length?'#c66':'#c90');
      toast(msg+(failed.length?(' · ✗ '+failed.length+' failed'):''), 8000);
    } else { closeGenius(); toast(msg); }
  }
  paint(); gStatus('Loading '+total+' link'+(total>1?'s':'')+'…', 'var(--bl)');
  pass(jobs, 4, function(f1){ retryFailed(f1, function(f2){ upgrade(function(){ finish(f2); }); }); });
}
// Discreet progress message for the import (small line — popup status / toast).
function _geniusProgMsg(p){
  if(!p) return 'Fetching lyrics…';
  if(p.stage==='done')   return '✓ Lyrics loaded';

  function tExt(){ return { delay:0, run:function(done){   // web: extension Content Controler (pestaña abierta o descarga sin CORS)
    _gExtReady(function(ok){
      if(S.over) return;
      if(!ok){ note(_gExtState==='old'?'extensión sin recargar':'sin extensión'); done(); return; }
      S.live.push(_gExtFetch(url, 12000, function(err, r){
        if(S.over) return;
        if(err && /extension unavailable|context invalidated/i.test(err)){ _gExt=false; _gExtState='old'; }   // solo hay un script huerfano en esta pestaña
        if(err){ note('extensión: '+err); done(); return; }
        if(r.lyrics){ var tl=_cleanGeniusText(r.lyrics); if(tl && offer(tl, 'tab', 'ok')) return; }   // pestaña con ESE link
        if(r.html){
          var lyr=parseGeniusHTML(r.html);
          if(lyr){ var v=_gVerify(_gCanon(r.html), key, r.finalUrl||''), id=_gIdFromHtml(r.html); if(id&&v!=='other') _gRememberId(key, id); if(offer(lyr, 'ext', v)) return; }
        }
        if(r.embed){ var em=_gParseEmbed(r.embed); if(em && em.lyr){ if(r.id) _gRememberId(key, r.id); if(offer(em.lyr, 'ext', 'ok')) return; } }   // v3: via busqueda + embed
        note('extensión: sin letra');
        done();
      }));
    });
  }}; }
  function tPage(px, delay){ return { delay:delay, run:function(done){
    if(px && !_gUp(px.n)){ done(); return; }
    S.live.push(_gGet(px?px.w(url):url, 8000, function(err, txt, fu){
      if(S.over) return;
      if(!px && err==='HTTP 404') S.notFound=true;
      if(!px && err) note('directa: '+err);
      if(!err && px && px.json){ try{ txt=JSON.parse(txt).contents||''; }catch(e){ txt=''; } }
      if(px) fu='';                                     // la URL final seria la del proxy, no la de Genius
      var lyr=(!err&&txt)?parseGeniusHTML(txt):null;
      if(px) _gMark(px.n, !!lyr, err);
      if(lyr){ var v=_gVerify(_gCanon(txt), key, fu), id=_gIdFromHtml(txt); if(id&&v!=='other') _gRememberId(key, id); if(offer(lyr, 'page', v)) return; }
      done();
    }));
  }}; }
  function tCurl(){ return { delay:0, run:function(done){
    S.live.push(_aeCurlFetch(url, function(html, fu){
      if(S.over) return;
      var lyr=html?parseGeniusHTML(html):null;
      if(lyr){ var v=_gVerify(_gCanon(html), key, fu), id=_gIdFromHtml(html); if(id&&v!=='other') _gRememberId(key, id); if(offer(lyr, 'curl', v)) return; }
      note(html?'curl: página sin letra':'curl: sin respuesta');
      done();
    }));
  }}; }
  // Niveles: si TODO un nivel falla (o pasa su "wait" sin ganador) arranca el siguiente.
  //  AE:  [embed cacheado + token + pagina directa + busqueda directa] → [curl] → [proxies]
  //  web: [embed cacheado + token + extension] → [proxies: busquedas (livianas) y paginas]
  // El reintento (2a vuelta) solo repite las vias que no son proxies (directa, curl, extension).
  function plan(retry){
    var A=[], B=[], C=[], d=0, i, cid=_gIds[key], tok=isG?_gToken():'';
    if(cid) A.push(tEmbed(cid));
    if(tok && !retry) A.push(tApi(tok));
    if(IN_AE){ A.push(tPage(null, 0)); if(isG) A.push(tSearch(null, 150)); B.push(tCurl()); }
    else if(isG) A.push(tExt());
    if(!retry){
      if(isG) for(i=0;i<_G_PROXIES.length;i++){ C.push(tSearch(_G_PROXIES[i], d)); d+=150; }
      for(i=0;i<_G_PROXIES.length;i++){ C.push(tPage(_G_PROXIES[i], d)); d+=150; }
    }
    return [ { tasks:A, wait:4000 }, { tasks:B, wait:8000, stage:'deep' }, { tasks:C, wait:0, stage:IN_AE?'deep':'' } ];
  }
  function runRound(){
    var T=plan(S.round>1), ti=0, out=0, allIn=false;
    for(var k=0;k<T.length;k++) S.total+=T[k].tasks.length;   // total del intento desde el inicio → progreso sin saltos atras
    function check(){ if(!S.over && allIn && out<=0) endRound(); }
    function launch(){
      if(S.over) return;
      if(ti>=T.length){ allIn=true; check(); return; }
      var tier=T[ti++], left=tier.tasks.length, moved=false;
      function adv(){ if(moved) return; moved=true; launch(); }
      if(!left){ adv(); return; }
      out+=left; if(tier.stage) prog(tier.stage);
      if(tier.wait) S.timers.push(setTimeout(adv, tier.wait));
      tier.tasks.forEach(function(t){
        S.timers.push(setTimeout(function(){
          if(S.over) return;
          var called=false;
          t.run(function(){ if(called) return; called=true; S.tried++; out--; if(S.over) return; prog('progress'); if(--left<=0) adv(); check(); });
        }, t.delay||0));
      });
    }
    launch();
  }
  function endRound(){
    if(S.over) return;
    if(S.cand){ win(S.cand.lyr, S.cand.src, false); return; }
    if(S.notFound){ lose('link not found on Genius (404)'); return; }
    // 2a vuelta solo si hay vias no-proxy que pueden recuperarse (AE: directa/curl; web: extension).
    if(S.round<2 && (IN_AE || _gExt===true)){ S.round++; prog('retry'); S.timers.push(setTimeout(runRound, 1200)); return; }
    if(!isG || opt.noLrc){ lose('no lyrics found'); return; }
    if(!S.lrcDone){ S.waitLrc=true; prog('lrclib'); return; }   // el respaldo sigue en camino
    if(S.lrc) win(S.lrc, 'lrclib', false); else lose('no lyrics found');
  }
  // Respaldo LRCLIB en paralelo desde el inicio: si Genius falla, ya esta listo (sin espera extra).
  if(isG && !opt.noLrc) S.live.push(_lrclibFetch(url, function(t){ S.lrc=t||null; S.lrcDone=true; if(S.waitLrc && !S.over){ if(S.lrc) win(S.lrc, 'lrclib', false); else lose('no lyrics found'); } }));
  prog('start');
  runRound();
}
// Texto de un nodo de letra: <br> = salto de linea. Fuera el encabezado de Genius
// (contribuidores / traducciones / descripcion "Read More") y los anuncios que van DENTRO
// del contenedor de la letra (Genius los marca con data-exclude-from-selection).
function _geniusNodeText(el){
  var clone=el.cloneNode(true), doc=clone.ownerDocument||document, i;
  var ex=clone.querySelectorAll('[data-exclude-from-selection="true"]');
  for(i=0;i<ex.length;i++){ if(ex[i].parentNode) ex[i].parentNode.removeChild(ex[i]); }
  var brs=clone.querySelectorAll('br');
  for(i=0;i<brs.length;i++){ if(brs[i].parentNode) brs[i].parentNode.replaceChild(doc.createTextNode('\n'), brs[i]); }
  return clone.textContent||'';
}
// Marcas de agua de Genius en la letra de la pagina: letras cirilicas/griegas identicas a
// las latinas ("е" U+0435 en vez de "e") y espacios raros (U+2005, U+205F…). En AE salen
// con otra fuente o como glifo faltante → se pasan a sus equivalentes normales. Solo en
// palabras que YA tienen letras latinas: una letra realmente en ruso/griego no se toca.
var _G_HOMO={'\u0430':'a','\u0435':'e','\u043E':'o','\u0440':'p','\u0441':'c','\u0443':'y','\u0445':'x','\u0456':'i','\u0458':'j','\u0455':'s','\u0501':'d','\u051B':'q','\u051D':'w','\u04BB':'h','\u04CF':'l',
  '\u0410':'A','\u0412':'B','\u0415':'E','\u041A':'K','\u041C':'M','\u041D':'H','\u041E':'O','\u0420':'P','\u0421':'C','\u0422':'T','\u0425':'X','\u0423':'Y','\u0406':'I','\u0408':'J','\u0405':'S','\u051A':'Q','\u051C':'W',
  '\u03BF':'o','\u03BD':'v','\u03C1':'p','\u0391':'A','\u0392':'B','\u0395':'E','\u0396':'Z','\u0397':'H','\u0399':'I','\u039A':'K','\u039C':'M','\u039D':'N','\u039F':'O','\u03A1':'P','\u03A4':'T','\u03A5':'Y','\u03A7':'X'};
function _gTidy(t){
  return String(t||'')
    .replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g,' ')
    .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
    .replace(/[^\s]+/g, function(w){
      if(!/[\u0370-\u03FF\u0400-\u04FF\u0500-\u052F]/.test(w) || !/[A-Za-z\u00C0-\u024F]/.test(w)) return w;
      return w.replace(/[\u0370-\u03FF\u0400-\u04FF\u0500-\u052F]/g, function(c){ return _G_HOMO[c]||c; });
    });
}
function _cleanGeniusText(t){
  t=_gTidy(String(t||'').replace(/\r\n?/g,'\n'));
  // Descripcion de Genius ("… Read More") ANTES de la primera [Seccion] → fuera. Solo antes
  // de la primera seccion: nunca recorta una letra que diga "Read More".
  var sec=t.search(/\[[^\]\n]{1,60}\]/), rm=t.indexOf('Read More');
  if(rm>=0 && (sec<0 || rm<sec)) t=t.slice(rm+9);
  // Respaldo: encabezado "N Contributors · Translations · <Titulo> Lyrics" sin descripcion.
  t=t.replace(/^\s*\d+\s*Contributors?[\s\S]*?Lyrics\s*/, function(m){ return /\[[^\]\n]{1,60}\]/.test(m)?m:''; });
  return t
          .replace(/\d*Embed\s*$/,'')                                 // contador "…Embed" final
          .replace(/\[[^\]\n]{0,60}\]/g,function(m){return '\n'+m+'\n';})
          .replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n')
          .replace(/\n{3,}/g,'\n\n').replace(/^\s+|\s+$/g,'');
}
function parseGeniusHTML(html){
  if(!html) return null;
  try{
    var doc=new DOMParser().parseFromString(html, 'text/html');

    // 1. Modern Genius: data-lyrics-container
    var nodes=doc.querySelectorAll('[data-lyrics-container="true"]');
    if(!nodes.length) nodes=doc.querySelectorAll('[class*="Lyrics__Container"]');
    if(!nodes.length) nodes=doc.querySelectorAll('.lyrics');
    if(nodes && nodes.length){
      var parts=[]; for(var i=0;i<nodes.length;i++) parts.push(_geniusNodeText(nodes[i]));
      var t=_cleanGeniusText(parts.join('\n')); if(t) return t;
    }

    // 2. JSON-LD schema (schema.org MusicRecording)
    var ldEl=doc.querySelector('script[type="application/ld+json"]');
    if(ldEl){ try{ var ld=JSON.parse(ldEl.textContent||'{}'); if(ld.lyrics&&ld.lyrics.text){ var lt=_cleanGeniusText(ld.lyrics.text); if(lt) return lt; } }catch(e){} }

    // 3. Inertia / SSR JSON embedded in <div id="app" data-page="...">
    var appEl=doc.querySelector('#app[data-page]');
    if(appEl){ try{
      var pg=JSON.parse(appEl.getAttribute('data-page')||'{}');
      var lyrObj=pg&&pg.props&&pg.props.song&&pg.props.song.lyrics_state;
      if(lyrObj&&lyrObj.body&&lyrObj.body.plain){ var pt=_cleanGeniusText(lyrObj.body.plain); if(pt) return pt; }
    }catch(e){} }

    // 4. Regex fallback: lyrics_body in JSON script
    var sm=html.match(/"lyrics_body"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if(sm){ try{ var rb=JSON.parse('"'+sm[1]+'"'); var ct=_cleanGeniusText(rb); if(ct) return ct; }catch(e){} }

    return null;
  }catch(e){ return null; }
}

// ─── UTILS ───
function fmtClock(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60); return p2(m)+':'+p2(sec); }
function fmtTimer(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+':'+p2(cs); }
function fmtTip(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+'.'+p2(cs); }
function toSRT(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60),ms=Math.floor((s%1)*1000); return p2(h)+':'+p2(m)+':'+p2(sec)+','+p3(ms); }
function p2(n){ return String(Math.floor(n)).padStart(2,'0'); }
function p3(n){ return String(n).padStart(3,'0'); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Static base legend: which channel I'm working on. Stays fixed in the status line while
// no transient toast is showing; toasts replace it briefly and then it returns.
var _legendBase='';
function _showBase(st){ st._tmp=false; st.textContent=_legendBase; st.classList.toggle('base', !!_legendBase); st.classList.toggle('on', !!_legendBase); }
function setLegend(msg){ _legendBase=(msg||'').trim(); var c=document.getElementById('tChannel'); if(c) c.textContent=_legendBase; }
// Inside AE the update legends appear in the small status line under the timer.
// On the web they use the floating toast.
// Legends always show in the status line ABOVE the timer (web too, like AE), never the
// bottom toast that overlapped the timeline. Falls back to #toast only if the bar isn't built yet.
function toast(msg,ms){
  var st=document.getElementById('tStatus');
  if(st){ st.textContent=msg; st.classList.add('on'); clearTimeout(st._t); st._t=setTimeout(function(){ st.classList.remove('on'); st.textContent=''; }, ms||4000); return; }
  var t=document.getElementById('toast'); if(t){ t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); },ms||2200); }
}
// ═══ MODULO 1: Artist/Song editables directo + detalles (nov 2026) ═══
// En Mac dentro de AE no se toca el foco (blur saca del panel y AE reproduce su composicion).
function _modBlur(el){ if(!el||document.activeElement!==el) return; if(IN_AE&&IS_MAC) return; try{ el.blur(); }catch(e){} }
function _modWire(ms, onArtist, onSong, onSongBlur){
  var a=document.getElementById('modArtist'), s=document.getElementById('modTitle');
  if(a) a.addEventListener('input', function(){ onArtist(this.value); });
  if(s) s.addEventListener('input', function(){ onSong(this.value); });
  if(s&&onSongBlur) s.addEventListener('blur', onSongBlur);
  [a,s].forEach(function(inp){ if(inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key==='Escape'){ e.preventDefault(); _modBlur(this); } }); });
  // Clic en el icono o en el fondo del modulo = abrir/cerrar detalles.
  ms.addEventListener('click', function(e){
    var t=e.target; if(!t||!t.closest) return;
    if(t.closest('#modIco')){ toggleDetails(e); return; }
    if(t.closest('input,textarea,button,select,a,.details-panel,.mod-gin')) return;
    toggleDetails(e);
  });
  // Clic fuera del modulo = cerrar (los avisos/modales no cuentan).
  document.addEventListener('mousedown', function(e){
    var t=e.target; if(t&&t.closest&&(t.closest('#modSong')||t.closest('.ov,#vlgBg,.rate-menu,#btnExportAll'))) return;
    if(ms.classList.contains('open')) closeDetails();
    var gi=document.getElementById('g-link-inline');
    if(ms.classList.contains('gmode') && !(gi&&gi.value.trim())) closeGeniusInput();
  });
  window.addEventListener('keydown', function(e){
    if(e.key!=='Escape') return; var tg=(document.activeElement&&document.activeElement.tagName)||'';
    if(tg==='INPUT'||tg==='TEXTAREA') return;
    if(ms.classList.contains('open')) closeDetails();
  });
  window.addEventListener('resize', function(){ if(ms.classList.contains('open')) _modFitExp(); });
}

function modSyncMeta(){
  if(typeof _modNav!=='undefined' && _modNav.idx>=0) return;   // pasando canales con la rueda: manda la vista previa
  var ch=getActive(), a=document.getElementById('modArtist'), s=document.getElementById('modTitle'), ic=document.getElementById('modIco');
  var av=(ch&&ch.artist)||'', sv=(ch&&ch.song)||'';
  if(a) a.placeholder=(ch&&ch.name)||'Artist';   // sin Artist, se ve el nombre del canal
  if(a&&document.activeElement!==a&&a.value!==av) a.value=av;
  if(s&&document.activeElement!==s&&s.value!==sv) s.value=sv;
  // icono del canal activo
  if(ic&&ch&&ic._chId!==ch.id){ ic._chId=ch.id; ic.innerHTML=avatarFor(ch); ic.title=(ch.name||'Channel')+' — channels & lyrics'; }
}
// Nombre del canal en la lista de detalles ("Artist - Song") mientras se edita en el modulo.
function _modRowName(ch){
  var n=document.querySelector('.channel[data-id="'+ch.id+'"] .ch-name'); if(!n) return;
  var info=((ch.artist||'')+(ch.artist&&ch.song?' - ':'')+(ch.song||'')).trim();
  n.textContent=info||(ch.id===expandedId?'Load a song…':'Untitled');
}
// Rueda / trackpad sobre el canal del modulo 1 (icono, Artist, Song) = canal anterior / siguiente,
// sin abrir los detalles. Mientras se gira solo cambia el modulo (vista previa: icono, artista,
// cancion y el nombre del canal en la leyenda); al detenerse (~0.3 s), al sacar el mouse o al hacer
// clic, se abre de verdad ese canal (letra, audio y, en AE, su cancion del proyecto). Asi no se
// carga cada canal por el que se pasa. Abajo/derecha = siguiente; arriba/izquierda = anterior.
var _modNav={acc:0, last:0, lastEv:0, idx:-1, t:null};
function _modNavIndex(){
  if(_modNav.idx>=0) return _modNav.idx;
  for(var i=0;i<channels.length;i++) if(channels[i].id===activeId) return i;
  return 0;
}
function _modNavPreview(ch, dir){
  var a=document.getElementById('modArtist'), s=document.getElementById('modTitle'), ic=document.getElementById('modIco'), meta=document.getElementById('modMeta');
  if(a){ a.value=ch.artist||''; a.placeholder=ch.name||'Artist'; }
  if(s) s.value=ch.song||'';
  if(ic){ ic._chId=ch.id; ic.innerHTML=avatarFor(ch); ic.title=(ch.name||'Channel')+' — channels & lyrics'; }
  [meta,ic].forEach(function(el){ if(!el) return; el.classList.remove('roll-next','roll-prev'); void el.offsetWidth; el.classList.add(dir>0?'roll-next':'roll-prev'); });
}
function _modNavStep(dir){
  var cur=_modNavIndex(), ni=Math.max(0, Math.min(channels.length-1, cur+dir));
  if(ni===cur) return;
  _modBlur(document.getElementById('modArtist')); _modBlur(document.getElementById('modTitle'));
  _modNav.idx=ni;
  var ch=channels[ni];
  _modNavPreview(ch, dir);
  toast(ch.name+'  ·  '+(ni+1)+'/'+channels.length, 1600);
  clearTimeout(_modNav.t); _modNav.t=setTimeout(_modNavCommit, 320);
}
function _modNavCommit(){
  clearTimeout(_modNav.t); _modNav.t=null;
  var i=_modNav.idx; _modNav.idx=-1;
  if(i<0||!channels[i]) return;
  if(channels[i].id!==activeId) selectChannel(channels[i].id);
  modSyncMeta();
}
function _modNavInit(ms){
  function onWheel(e){
    if(!channels||channels.length<2) return;
    var unit=(e.deltaMode===1)?16:(e.deltaMode===2)?120:1;
    var d=(Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX)*unit; if(!d) return;
    e.preventDefault();
    var now=Date.now();
    if(_modNav.idx>=0){ clearTimeout(_modNav.t); _modNav.t=setTimeout(_modNavCommit, 320); }   // se abre al DEJAR de girar
    if(now-_modNav.lastEv>260) _modNav.acc=0;          // pausa = empieza de cero
    _modNav.lastEv=now;
    if(now-_modNav.last<170) return;                   // un canal a la vez (la inercia no se dispara)
    if(_modNav.acc && (d>0)!==(_modNav.acc>0)) _modNav.acc=0;
    _modNav.acc+=d;
    if(Math.abs(_modNav.acc)>=50){ var dir=_modNav.acc>0?1:-1; _modNav.acc=0; _modNav.last=now; _modNavStep(dir); }
  }
  ['modIco','modMeta'].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('wheel', onWheel, {passive:false}); });
  var meta=document.getElementById('modMeta'); if(meta) meta.title='Scroll: previous / next channel';
  ms.addEventListener('mouseleave', function(){ if(_modNav.t) _modNavCommit(); });
  ms.addEventListener('mousedown', function(){ if(_modNav.t) _modNavCommit(); }, true);
}
function initModules(){
  var ms=document.getElementById('modSong'); if(!ms||ms._modInit) return; ms._modInit=true;
  _modWire(ms,
    function(v){ var ch=getActive(); if(!ch) return; editArtist(ch.id, v); _modRowName(ch); },
    function(v){ var ch=getActive(); if(!ch) return; editSong(ch.id, v); _modRowName(ch); },
    // Al salir del Song: si trae featuring/ft/feat, se mueve al Artist (Song queda limpio).
    function(){ var ch=getActive(); if(!ch||typeof _splitFeat!=='function') return; var r=_splitFeat(ch.artist||'', ch.song||'');
      if(r.song!==(ch.song||'')||r.artist!==(ch.artist||'')){ ch.song=r.song; ch.artist=r.artist; syncTitle(); updateSub(ch.id); updDim(ch.id); _modRowName(ch); } });
  _modNavInit(ms);
  modSyncMeta();
}
// Boton de buscar del modulo 1 (LMG/CM): abre los detalles con el cargador de links de Genius.
function searchAction(ev){
  if(ev&&ev.stopPropagation) ev.stopPropagation();
  var ms=document.getElementById('modSong'), was=!!(ms&&ms.classList.contains('open'));
  if(!was) setDetailsOpen(true);
  var gb=document.getElementById('dpGlobalBar');
  if(was || !gb || !gb.classList.contains('genius-open')) lyricsAction();
}
try{ initModules(); }catch(e){ try{ console.error('[Verso] modules', e); }catch(e2){} }
