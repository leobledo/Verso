// ─── STAMP ───
function doStamp(){
  var ach=getActive(); if(!ach||!ach.audioURL){ toast('Load audio for this channel first'); return; }
  if(!lines.length){ toast('Add lyrics first'); return; }
  lyrBrowseUntil=0; lyrManualY=null;   // stamping snaps the lyrics back to the current line
  // When timestamping starts, collapse the expanded channel container for more room.
  if(expandedId!==null){ expandedId=null; setExpanded(-1); }
  // Each ENTER stamps the current line and moves to the next (v2 behaviour). Marker length is adjusted manually by resizing.
  curLine=nextStampable(curLine);
  if(curLine>=lines.length){
    // No more lines: one last ENTER closes the last marker at the current time.
    if(stamps.length){
      var last=stamps[stamps.length-1], end=AEL.currentTime;
      if(end>last.time+0.05){ pushUndo(); last.len=end-last.time; saveWorkingSet(); tlRefresh(); toast('last marker closed at '+fmtClock(end)); return; }
    }
    toast('All lines stamped'); return;
  }
  pushUndo();
  var grp=stampGroupFrom(curLine);   // up to linesPerStamp stampable lines
  if(!grp.length){ toast('All lines stamped'); return; }
  stamps.push({id:++stampSeq,lineIdx:grp[0],idxs:grp,time:AEL.currentTime}); stamps.sort(function(a,b){ return a.time-b.time; });
  curLine=nextStampable(grp[grp.length-1]+1);
  saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0);
  // Sin leyenda por marcador: la hora al colocar no es relevante y ensuciaba la barra.
}

// ─── UNDO / REDO ───
function pushUndo(){ undoStack.push({stamps:JSON.parse(JSON.stringify(stamps)),curLine:curLine}); if(undoStack.length>80) undoStack.shift(); redoStack=[]; }
function undoAction(){ if(!undoStack.length){ toast('Nothing to undo'); return; } redoStack.push({stamps:JSON.parse(JSON.stringify(stamps)),curLine:curLine}); var s=undoStack.pop(); stamps=s.stamps; curLine=s.curLine; saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0); toast('Undo'); }
function redoAction(){ if(!redoStack.length){ toast('Nothing to redo'); return; } undoStack.push({stamps:JSON.parse(JSON.stringify(stamps)),curLine:curLine}); var s=redoStack.pop(); stamps=s.stamps; curLine=s.curLine; saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0); toast('Redo'); }

// ─── KEYBOARD ───
function onKey(e){
  var tg=document.activeElement.tagName; if(tg==='TEXTAREA'||tg==='INPUT'||tg==='SELECT') return;
  // stop() evita que la tecla llegue a AE (en Mac CMD+Z disparaba el undo del proyecto y
  // sacaba el foco a la timeline principal). registerKeyEventsInterest hace lo mismo a
  // nivel CEP; esto lo refuerza en el lado del panel.
  function stop(){ e.preventDefault(); if(e.stopPropagation) e.stopPropagation(); }
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){ stop(); if(e.shiftKey) redoAction(); else undoAction(); return; }
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyY'){ stop(); redoAction(); return; }   // CMD/CTRL+Y = redo
  if(e.code==='Space'){ stop(); togglePlay(); return; }
  if(e.code==='Enter'||e.code==='NumpadEnter'){ stop(); doStamp(); return; }
  if((e.code==='Delete'||e.code==='Backspace') && selStampSet.size){ stop(); pushUndo(); stamps=stamps.filter(function(s){ return !selStampSet.has(s.id); }); selStampSet.clear(); recomputeCurLine(); saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0); toast('Marker(s) deleted'); }
}
// CEP: reclamar estas combinaciones para que AE NO las procese (que no reproduzca su comp con
// Space, no dispare el undo del proyecto con Cmd+Z, etc.) y las reciba el panel.
// CLAVE: registerKeyEventsInterest usa el keyCode de JavaScript (Space=32, Enter=13, Z=90...),
// el MISMO en Windows y Mac. El bug era usar en Mac los virtuales de macOS (Space=49): AE nunca
// soltaba Space y reproducia su composicion. Ahora Mac usa 32 igual que Windows.
function _registerKeys(){
  try{
    if(!csInterface || !csInterface.registerKeyEventsInterest){
      if(IS_MAC && !_registerKeys._warned){ _registerKeys._warned=1; toast('⚠ registerKeyEventsInterest no disponible en este CEP — avisa a soporte', 6000); }
      return;
    }
    var ev;
    if(IS_MAC){
      // MAC: formato minimo (solo el modificador que aplica) para combos SIN modificador
      // (ya confirmado funcionando para Play). Para combos CON modificador (undo/redo) se usa
      // el formato explicito de 4 banderas (K2, igual que Windows), reforzado con respaldos de
      // virtual keycode de macOS por si esta build de CEP los matchea asi.
      ev=[];
      function m(code, mods){ var o={keyCode:code}; if(mods) for(var k in mods) o[k]=mods[k]; ev.push(o); }
      // NO TOCAR: formato ya confirmado funcionando para Play en Mac.
      m(32);                                            // Space (play)
      m(13);                                            // Enter / NumpadEnter (stamp) — ambos son keyCode 13
      m(8); m(46);                                      // Backspace / Delete (borrar)
      function K2(code, ctrl, meta, shift){ return { keyCode:code, ctrlKey:!!ctrl, altKey:false, shiftKey:!!shift, metaKey:!!meta }; }
      ev.push(K2(90,false,true,false), K2(90,false,true,true));   // Cmd+Z / Cmd+Shift+Z (undo/redo)
      ev.push(K2(90,true,false,false), K2(90,true,false,true));   // Ctrl+Z / Ctrl+Shift+Z
      ev.push(K2(89,false,true,false), K2(89,true,false,false));  // Cmd/Ctrl+Y (redo)
      // Respaldo: mismos combos con los virtual keycodes de macOS (Z=6, Y=16)
      m(90,{metaKey:true}); m(90,{metaKey:true,shiftKey:true});
      m(90,{ctrlKey:true}); m(90,{ctrlKey:true,shiftKey:true});
      m(89,{metaKey:true}); m(89,{ctrlKey:true});
      m(6,{metaKey:true}); m(6,{metaKey:true,shiftKey:true}); m(6,{ctrlKey:true}); m(6,{ctrlKey:true,shiftKey:true});
      m(16,{metaKey:true}); m(16,{ctrlKey:true});
      // Respaldo generico: virtual keycodes de macOS para Enter/Delete
      m(49); m(36); m(76); m(51); m(117);
    } else {
      // WINDOWS: formato que ya funciona perfecto — NO cambiar.
      function K(code, ctrl, meta, shift){ return { keyCode:code, ctrlKey:!!ctrl, altKey:false, shiftKey:!!shift, metaKey:!!meta }; }
      ev=[
        K(90,true,false,false), K(90,false,true,false),   // Ctrl+Z / Cmd+Z  (undo)
        K(90,true,false,true),  K(90,false,true,true),    // +Shift          (redo)
        K(89,true,false,false), K(89,false,true,false),   // Ctrl/Cmd+Y      (redo)
        K(32,false,false,false),                          // Space           (play)
        K(13,false,false,false),                          // Enter           (stamp)
        K(8,false,false,false), K(46,false,false,false)   // Backspace / Del (borrar)
      ];
    }
    var _r=csInterface.registerKeyEventsInterest(JSON.stringify(ev));
    // Diagnostico (una vez): confirma en vivo si el registro se ejecuto sin lanzar. No
    // garantiza que AE lo honre, pero descarta que el bridge nativo este ausente o fallando.
    if(IS_MAC && !_registerKeys._ok){ _registerKeys._ok=1; toast('Verso: teclas registradas ('+ev.length+')', 2500); }
  }catch(e){
    if(IS_MAC && !_registerKeys._err){ _registerKeys._err=1; toast('⚠ Verso: fallo registrando teclas — '+(e&&e.message||e), 6000); }
  }
}

// ─── GLOBAL MOUSE ───
function onGlobalMove(e){
  if(hDrag){ var dx=e.clientX-hStartX, w=Math.max(220,Math.min(hStartW+dx, document.getElementById('workspace').offsetWidth*0.6)); document.getElementById('songsPanel').style.width=w+'px'; tlRefresh(); return; }
  if(vDrag){ var dy=vStartY-e.clientY, h=Math.max(80,Math.min(vStartH+dy, window.innerHeight*0.5)); document.getElementById('timelineZone').style.height=h+'px'; tlRefresh(); return; }
  if(tlPanning){ var pr=tlTrack.getBoundingClientRect(); if(pr.width){ var pdx=e.clientX-tlPanStartX; scrollPct=clampScroll(tlPanStartScroll - pdx/pr.width/zoom); scrollTarget=scrollPct; tlRefresh(); } return; }
  if(miniDragging){ miniSeek(e.clientX); return; }
  if(scrubbing){ doScrub(e.clientX); return; }
  if(mkDrag){
    var ddx=e.clientX-mkDrag.startX; if(Math.abs(ddx)>2) mkDrag.moved=true;
    if(mkDrag.moved&&!mkDrag.pushed){ pushUndo(); mkDrag.pushed=true; }
    var s=getStampById(mkDrag.sid); if(!s||!mkDrag.W) return;
    var secPerPx=(dur/zoom)/mkDrag.W, di=stamps.indexOf(s), GAP=Math.max(0.02,4*secPerPx);
    if(mkDrag.mode==='move'){
      var desired=Math.max(0,Math.min(dur,mkDrag.t0+ddx*secPerPx));
      if(mkDrag.touch){
        s.time=desired; showTip(s.time,e.clientX);
      } else {
        var bodyS=(s.len!=null?s.len:0);
        var prev=stamps[di-1], next=stamps[di+1];
        var lo=prev?(prev.time+(prev.len!=null?prev.len:0)+GAP):0, hi=next?(next.time-GAP-bodyS):dur; if(hi<lo) hi=lo;
        s.time=Math.max(lo,Math.min(hi,desired)); showTip(s.time,e.clientX);
      }
    }
    else if(mkDrag.mode==='r'){
      // right edge: clamp against the NEXT marker (leave a gap) — never push it.
      var nR=stamps[di+1];
      var maxLen=(nR?(nR.time-GAP):dur)-s.time;
      s.len=Math.max(0.1, Math.min(mkDrag.len0+ddx*secPerPx, Math.max(0.1,maxLen)));
      showTip(s.time+s.len,e.clientX);
    }
    else {
      // left edge: move start, keep the right edge fixed; clamp against the PREV marker.
      var pL=stamps[di-1];
      var minT=pL?(pL.time+(pL.len!=null?pL.len:0)+GAP):0;
      var rightEdge=mkDrag.t0+mkDrag.len0;
      var nt=Math.max(minT, Math.min(rightEdge-0.1, mkDrag.t0+ddx*secPerPx));
      s.time=nt; s.len=Math.max(0.1, rightEdge-nt); showTip(s.time,e.clientX);
    }
    tlRefresh(); return;
  }
  if(lyrDrag){ var dy2=e.clientY-lyrDragStartY; if(Math.abs(dy2)>3) lyrMoved=true; var fl=document.getElementById('lyrFlow'); fl.style.transform='translateY('+(lyrBaseY+dy2)+'px)'; lyrManualY=lyrBaseY+dy2; return; }
}
function onGlobalUp(){
  if(hDrag){ hDrag=false; document.getElementById('rszH').classList.remove('drag'); }
  if(vDrag){ vDrag=false; document.getElementById('rszV').classList.remove('drag'); }
  if(scrubbing){ scrubbing=false; }
  if(tlPanning){ tlPanning=false; }
  if(miniDragging){ miniDragging=false; }
  if(mkDrag){
    if(!mkDrag.moved){ if(mkDrag.ctrl){ if(selStampSet.has(mkDrag.sid)) selStampSet.delete(mkDrag.sid); else selStampSet.add(mkDrag.sid); } else { selStampSet.clear(); selStampSet.add(mkDrag.sid); } }
    else { stamps.sort(function(a,b){ return a.time-b.time; }); saveWorkingSet(); updTimed(); }
    hideTip(); mkDrag=null; tlRefresh(); updateLyricHighlight(AEL.currentTime||0);
    if(IS_TOUCH) syncTouchButtons();
  }

// ─── EXPORT / IMPORT ───
// Builds the SRT string from the current stamps. lpb = lines per block.
// Text of a stamp = its covered lines joined (Verso 2: up to 3 lines per timestamp).
function stampTextOf(s, ln){ ln=ln||lines; if(s.idxs&&s.idxs.length) return s.idxs.map(function(i){ return ln[i]||''; }).join('\n'); return ln[s.lineIdx]||''; }
function buildSRT(lpb){
  lpb=lpb||1; var blocks=[];
  for(var i=0;i<stamps.length;i+=lpb){ var blk=stamps.slice(i,i+lpb), st=blk[0].time, li=i+blk.length-1, last=stamps[li], en=last.time+markerLen(last,li); if(dur) en=Math.min(en,dur); blocks.push({st:st,en:Math.max(st+.3,en),txt:blk.map(function(s){ return stampTextOf(s,lines); }).join('\n')}); }
  return blocks.map(function(b,i){ return (i+1)+'\n'+toSRT(b.st)+' --> '+toSRT(b.en)+'\n'+b.txt; }).join('\n\n');
}

  var ch=getActive();

// Channels whose import auto-creates the AE comp (named like the channel) when no comp is selected.
function chAutoCreatesComp(name){ return (name||'').trim().toLowerCase()==='nightclub nostalgia'; }

// Import lyrics into After Effects using the "Style Controler" layer:
//   - Target comp = the comp selected/active in the AE Project panel.
//   - If none is selected and the channel auto-creates (Nightclub Nostalgia),
//     a comp named like the channel is found or created.
//   - Each line is a duplicate of the "Style Controler" layer (inherited style +
//     box text), centered, with an opacity fade in/out expression.
function importStyleController(){
  if(!csInterface){ toast('Not running inside After Effects'); return; }
  if(!stamps.length){ toast('No timestamps yet'); return; }
  var lpbEl=document.getElementById('lpb'), lpb=lpbEl?(parseInt(lpbEl.value)||1):1;
  var srt=buildSRT(lpb); if(!srt.trim()){ toast('Nothing to import'); return; }
  var ch=getActive(), chName=(ch&&ch.name)?ch.name.trim():'';
  var opt={
    compName:chName,
    autoCreate:chAutoCreatesComp(chName),
    styleLayerName:'Style Controler',
    fadeIn:0.3, fadeOut:0.3,
    center:true, extend:true,
    // Verso single-channel: target the comp containing "Lyrics" automatically.
    lyricsBySuffix:true,
    compWidth:1920, compHeight:1080, compFps:30, compDuration:60

// Pull the channel's Song audio from the project into the timeline.
// Self-contained ExtendScript (does NOT depend on host.jsx being loaded): it finds the
// "… Song" footage by exact name (else by leading number among audio footage) and returns
// the on-disk path of whatever file is currently loaded there.
// verbose=true → toast the reason if it can't be found (used on channel click / play).
// Self-contained ExtendScript that finds the channel's "… Song" footage (by name, else
// by leading number) and returns "OK:<current file path>" or "ERR:…". No host needed.
function _songReadJsx(ch){
  // Mode-aware: Video reads the "Song" footage (excluding "short"); Short reads "Short Song".
  var isShort=SHORT_MODE;
  var want=isShort?'short song':((ch.songName||'song').toLowerCase());
  return '(function(){try{'+
    'var want='+JSON.stringify(want)+';var isShort='+(isShort?'true':'false')+';var found=null,list=[];'+
    'function ok(nm){nm=nm.toLowerCase();if(nm.indexOf("song")===-1)return false;return isShort?(nm.indexOf("short")!==-1):(nm.indexOf("short")===-1);}'+
    'for(var i=1;i<=app.project.numItems;i++){var it=app.project.item(i);'+
      'if(it instanceof FootageItem){'+
        'if(it.hasAudio)list.push(it.name);'+
        'var n=it.name.replace(/^\\s+|\\s+$/g,"").toLowerCase();'+
        'if(n===want){found=it;break;}'+
      '}}'+
    'if(!found){for(var s=1;s<=app.project.numItems;s++){var it3=app.project.item(s);'+
      'if(it3 instanceof FootageItem && ok(it3.name)){found=it3;break;}'+
    '}}'+
    'if(!found)return "ERR:Audio not found. Available: "+(list.join(" | ")||"(none)");'+
    'var f=null;try{f=found.file;}catch(e){}if(!f){try{f=found.mainSource.file;}catch(e){}}'+
    'if(!f)return "ERR:\\""+found.name+"\\" has no file on disk (load it with Master)";'+
    'return "OK:"+f.fsName;'+
  '}catch(e){return "ERR:"+e.toString();}})()';
}
// Apply a channel's loaded-song title (from the file name). overwrite=true replaces it.
// Construye una URL file:// valida en Windows y macOS. Las rutas de Mac suelen llevar
// espacios y acentos: sin escapar, el <audio> no carga y el play no hacia nada.
// Deja el SRT ASCII-safe ANTES de cruzar el puente de CEP: con caracteres no-ASCII
// evalScript puede devolver vacio y el panel mostraba "No response". Tambien evita
// que AE sustituya la fuente en esos glifos.
function _srtSafe(s){
  return String(s==null?"":s)
    .replace(/[\u2018\u2019\u201A\u201B\u02BC\u2032]/g, "'")
    .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
    .replace(/[\u2010\u2011\u2012\u2013\u2014\u2015]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/[\u00A0\u2007\u2009\u200A\u202F]/g, ' ')
    .replace(/[\u200B\u200C\u200D\u200E\u200F\uFEFF]/g, '');
}
function _fileURL(p){
  var cp=String(p||'').replace(/\\/g,'/');
  if(cp.charAt(0)!=='/') cp='/'+cp;            // Windows: /C:/... ; Mac ya empieza con /
  var enc=cp; try{ enc=encodeURI(cp); }catch(e){}
  return 'file://'+enc.replace(/#/g,'%23').replace(/\?/g,'%3F');
}
function _applySongTitle(ch, path, overwrite){

  if(meta.song   && (overwrite || !(curS&&curS.trim()))){ setChSong(ch,meta.song);     changed=true; }

    ch.name=ch.song.trim();

  ensureHost(function(ok){

      function _masterDone(txt){
      var r=_parseRes(txt, 'Master'); if(!r) return;
      if(!r.ok){ toast('Master: '+(r.msg||r.step||'error')); return; }
      toast('✓ Audio '+r.replaced+'/'+r.total+' · Lyrics '+r.lyricsCleaned+'/'+r.lyricsTotal+' · Ranges '+r.rangeUpdated+'/'+r.rangeTotal);
      // Clear all SRT layers (separate call so it never risks breaking the song replacement).
      csInterface.evalScript('clearAllLyricLayers()', function(){});

      if(r.songs && r.songs.length){
        var applied=0;
        r.songs.forEach(function(s){
          if(!s.path) return;
          var sname=(s.name||'').toLowerCase().replace(/\s+/g,'');

    });

function _gExtReady(cb){
  if(IN_AE){ cb(false); return; }
  if(_gExt!==null){ cb(_gExt); return; }
  _gExtWait.push(cb); if(_gExtWait.length>1) return;
  var id='p'+Date.now()+'_'+Math.random(), fin=false;
  function end(v){ if(fin) return; fin=true; window.removeEventListener('message', on); _gExt=v; var w=_gExtWait; _gExtWait=[]; for(var i=0;i<w.length;i++){ try{ w[i](v); }catch(e){} } if(!v) setTimeout(function(){ if(_gExt===false) _gExt=null; }, 30000); }
  function on(e){ if(e.source!==window) return; var d=e.data; if(d && d.type==='VERSO_EXT_PONG' && d.reqId===id) end(!!d.fetch); }
  window.addEventListener('message', on);
  try{ window.postMessage({ type:'VERSO_EXT_PING', reqId:id }, '*'); }catch(e){}
  setTimeout(function(){ end(false); }, 500);
}
// Pide a la extension la letra de UN link. cb(err, {lyrics|html, finalUrl, source}). Devuelve {abort}.
function _gExtFetch(url, ms, cb){
  var id='f'+Date.now()+'_'+Math.random(), fin=false;
  function stop(){ fin=true; clearTimeout(to); window.removeEventListener('message', on); }
  function on(e){ if(e.source!==window) return; var d=e.data; if(!d || d.type!=='VERSO_FETCH_GENIUS_RESULT' || d.reqId!==id || fin) return; stop(); cb(d.error||null, d); }
  window.addEventListener('message', on);
  var to=setTimeout(function(){ if(fin) return; stop(); cb('timeout', {}); }, ms);
  try{ window.postMessage({ type:'VERSO_FETCH_GENIUS', reqId:id, url:url }, '*'); }catch(e){}
  return { abort:function(){ if(!fin) stop(); } };
}
// cb(err, letra, fuente) · fuente: 'tab' | 'ext' | 'embed' | 'page' | 'curl' | 'lrclib'. onProg(p) = estado.
function fetchGeniusLyrics(url, cb, onProg){
  url=String(url||'').trim();
  if(!/^https?:\/\//i.test(url)){ cb('invalid url', null); return; }
  var key=_gNorm(url), isG=_gIsGenius(url);
  if(_gMem[key]){ var mc=_gMem[key]; setTimeout(function(){ if(onProg){ try{ onProg({stage:'done', done:1, total:1}); }catch(e){} } cb(null, mc.lyr, mc.src); }, 0); return; }
  var S={ over:false, cand:null, live:[], timers:[], tried:0, total:0, round:1, notFound:false, lrc:null, lrcDone:false, waitLrc:false };
  function prog(stage){ if(onProg){ try{ onProg({stage:stage, done:S.tried, total:Math.max(1,S.total)}); }catch(e){} } }
  function stopAll(){ var i; for(i=0;i<S.timers.length;i++) clearTimeout(S.timers[i]); for(i=0;i<S.live.length;i++){ try{ S.live[i].abort(); }catch(e){} } S.timers=[]; S.live=[]; }
  function win(lyr, src, keep){ if(S.over) return; S.over=true; stopAll(); if(keep) _gMem[key]={lyr:lyr, src:src}; prog('done'); cb(null, lyr, src); }
  function lose(err){ if(S.over) return; S.over=true; stopAll(); cb(err||'no lyrics found', null); }
  function offer(lyr, src, verdict){
    if(!lyr||S.over) return false;
    if(verdict==='other'){ if(!S.cand) S.cand={ lyr:lyr, src:src }; return false; }   // no es el link exacto: solo si nada mejor aparece
    win(lyr, src, true); return true;
  }
  function tEmbed(id){ return { delay:0, run:function(done){
    S.live.push(_gGet('https://genius.com/songs/'+id+'/embed.js', 7000, function(err, txt){
      if(S.over) return;
      var e=(!err&&txt)?_gParseEmbed(txt):null;
      if(e && offer(e.lyr, 'embed', 'ok')) return;   // id = match exacto del link (busqueda o cache)
      done();
    }));
  }}; }
  function tSearch(px, delay){ return { delay:delay, run:function(done){
    if(px && !_gUp(px.n)){ done(); return; }
    var q=encodeURIComponent(_gQuery(url));
    (function page(pg){
      var su='https://genius.com/api/search/song?per_page=10&page='+pg+'&q='+q;
      S.live.push(_gGet(px?px.w(su):su, 6000, function(err, txt){
        if(S.over) return;
        var j=null; if(!err){ try{ j=JSON.parse(txt); if(px&&px.json) j=JSON.parse(j.contents||'null'); }catch(e){ j=null; } }
        if(px) _gMark(px.n, !!(j&&j.response), err);
        var r=j?_gPickId(j, key):{ id:0, n:0 };
        if(!r.id){ if(pg===1 && r.n>=10){ page(2); return; } done(); return; }   // no esta en la 1a pagina → 2a
        _gRememberId(key, r.id);
        tEmbed(r.id).run(done);
      }));
    })(1);
  }}; }
  function tApi(tok){ return { delay:0, run:function(done){   // API oficial (token opcional): CORS abierto, sin proxy
    S.live.push(_gGet('https://api.genius.com/search?per_page=20&q='+encodeURIComponent(_gQuery(url))+'&access_token='+encodeURIComponent(tok), 8000, function(err, txt){
      if(S.over) return;
      var j=null; if(!err){ try{ j=JSON.parse(txt); }catch(e){} }
      var r=j?_gPickId(j, key):{ id:0 };
      if(!r.id){ done(); return; }
      _gRememberId(key, r.id);
      tEmbed(r.id).run(done);
    }));
  }}; }
  function tExt(){ return { delay:0, run:function(done){   // web: extension Content Controler (pestaña abierta o descarga sin CORS)
    _gExtReady(function(ok){
      if(S.over) return;
      if(!ok){ done(); return; }
      S.live.push(_gExtFetch(url, 15000, function(err, r){
        if(S.over) return;
        if(!err && r.lyrics){ var tl=_cleanGeniusText(r.lyrics); if(tl && offer(tl, 'tab', 'ok')) return; }   // pestaña con ESE link
        if(!err && r.html){
          var lyr=parseGeniusHTML(r.html);
          if(lyr){ var v=_gVerify(_gCanon(r.html), key, r.finalUrl||''), id=_gIdFromHtml(r.html); if(id&&v!=='other') _gRememberId(key, id); if(offer(lyr, 'ext', v)) return; }
        }
        done();
      }));
    });
  }}; }
  function tPage(px, delay){ return { delay:delay, run:function(done){
    if(px && !_gUp(px.n)){ done(); return; }
    S.live.push(_gGet(px?px.w(url):url, 8000, function(err, txt, fu){
      if(S.over) return;
      if(!px && err==='HTTP 404') S.notFound=true;
      if(!err && px && px.json){ try{ txt=JSON.parse(txt).contents||''; }catch(e){ txt=''; } }
      if(px) fu='';                                     // la URL final seria la del proxy, no la de Genius
      var lyr=(!err&&txt)?parseGeniusHTML(txt):null;
      if(px) _gMark(px.n, !!lyr, err);
      if(lyr){ var v=_gVerify(_gCanon(txt), key, fu), id=_gIdFromHtml(txt); if(id&&v!=='other') _gRememberId(key, id); if(offer(lyr, 'page', v)) return; }
      done();
    }));
  }}; }
  function tCurl(){ return { delay:0, run:function(done){
    S.live.push(_aeCurlFetch(url, function(html, fu){
      if(S.over) return;
      var lyr=html?parseGeniusHTML(html):null;
      if(lyr){ var v=_gVerify(_gCanon(html), key, fu), id=_gIdFromHtml(html); if(id&&v!=='other') _gRememberId(key, id); if(offer(lyr, 'curl', v)) return; }
      done();
    }));
  }}; }
  // Niveles: si TODO un nivel falla (o pasa su "wait" sin ganador) arranca el siguiente.
  //  AE:  [embed cacheado + token + pagina directa + busqueda directa] → [curl] → [proxies]
  //  web: [embed cacheado + token + extension] → [proxies: busquedas (livianas) y paginas]
  // El reintento (2a vuelta) solo repite las vias que no son proxies (directa, curl, extension).
  function plan(retry){
    var A=[], B=[], C=[], d=0, i, cid=_gIds[key], tok=isG?_gToken():'';
    if(cid) A.push(tEmbed(cid));
    if(tok && !retry) A.push(tApi(tok));
    if(IN_AE){ A.push(tPage(null, 0)); if(isG) A.push(tSearch(null, 150)); B.push(tCurl()); }
    else if(isG) A.push(tExt());
    if(!retry){
      if(isG) for(i=0;i<_G_PROXIES.length;i++){ C.push(tSearch(_G_PROXIES[i], d)); d+=150; }
      for(i=0;i<_G_PROXIES.length;i++){ C.push(tPage(_G_PROXIES[i], d)); d+=150; }
    }
    return [ { tasks:A, wait:4000 }, { tasks:B, wait:8000, stage:'deep' }, { tasks:C, wait:0, stage:IN_AE?'deep':'' } ];
  }
  function runRound(){
    var T=plan(S.round>1), ti=0, out=0, allIn=false;
    for(var k=0;k<T.length;k++) S.total+=T[k].tasks.length;   // total del intento desde el inicio → progreso sin saltos atras
    function check(){ if(!S.over && allIn && out<=0) endRound(); }
    function launch(){
      if(S.over) return;
      if(ti>=T.length){ allIn=true; check(); return; }
      var tier=T[ti++], left=tier.tasks.length, moved=false;
      function adv(){ if(moved) return; moved=true; launch(); }
      if(!left){ adv(); return; }
      out+=left; if(tier.stage) prog(tier.stage);
      if(tier.wait) S.timers.push(setTimeout(adv, tier.wait));
      tier.tasks.forEach(function(t){
        S.timers.push(setTimeout(function(){
          if(S.over) return;
          var called=false;
          t.run(function(){ if(called) return; called=true; S.tried++; out--; if(S.over) return; prog('progress'); if(--left<=0) adv(); check(); });
        }, t.delay||0));
      });
    }
    launch();
  }
  function endRound(){
    if(S.over) return;
    if(S.cand){ win(S.cand.lyr, S.cand.src, false); return; }
    if(S.notFound){ lose('link not found on Genius (404)'); return; }
    // 2a vuelta solo si hay vias no-proxy que pueden recuperarse (AE: directa/curl; web: extension).
    if(S.round<2 && (IN_AE || _gExt===true)){ S.round++; prog('retry'); S.timers.push(setTimeout(runRound, 600)); return; }
    if(!isG){ lose('no lyrics found'); return; }
    if(!S.lrcDone){ S.waitLrc=true; prog('lrclib'); return; }   // el respaldo sigue en camino
    if(S.lrc) win(S.lrc, 'lrclib', false); else lose('no lyrics found');
  }
  // Respaldo LRCLIB en paralelo desde el inicio: si Genius falla, ya esta listo (sin espera extra).
  if(isG) S.live.push(_lrclibFetch(url, function(t){ S.lrc=t||null; S.lrcDone=true; if(S.waitLrc && !S.over){ if(S.lrc) win(S.lrc, 'lrclib', false); else lose('no lyrics found'); } }));
  prog('start');
  runRound();
}
// Texto de un nodo de letra: <br> = salto de linea. Fuera el encabezado de Genius
// (contribuidores / traducciones / descripcion "Read More") y los anuncios que van DENTRO
// del contenedor de la letra (Genius los marca con data-exclude-from-selection).
function _geniusNodeText(el){
  var clone=el.cloneNode(true), doc=clone.ownerDocument||document, i;
  var ex=clone.querySelectorAll('[data-exclude-from-selection="true"]');
  for(i=0;i<ex.length;i++){ if(ex[i].parentNode) ex[i].parentNode.removeChild(ex[i]); }
  var brs=clone.querySelectorAll('br');
  for(i=0;i<brs.length;i++){ if(brs[i].parentNode) brs[i].parentNode.replaceChild(doc.createTextNode('\n'), brs[i]); }
  return clone.textContent||'';
}
// Marcas de agua de Genius en la letra de la pagina: letras cirilicas/griegas identicas a
// las latinas ("е" U+0435 en vez de "e") y espacios raros (U+2005, U+205F…). En AE salen
// con otra fuente o como glifo faltante → se pasan a sus equivalentes normales. Solo en
// palabras que YA tienen letras latinas: una letra realmente en ruso/griego no se toca.
var _G_HOMO={'\u0430':'a','\u0435':'e','\u043E':'o','\u0440':'p','\u0441':'c','\u0443':'y','\u0445':'x','\u0456':'i','\u0458':'j','\u0455':'s','\u0501':'d','\u051B':'q','\u051D':'w','\u04BB':'h','\u04CF':'l',
  '\u0410':'A','\u0412':'B','\u0415':'E','\u041A':'K','\u041C':'M','\u041D':'H','\u041E':'O','\u0420':'P','\u0421':'C','\u0422':'T','\u0425':'X','\u0423':'Y','\u0406':'I','\u0408':'J','\u0405':'S','\u051A':'Q','\u051C':'W',
  '\u03BF':'o','\u03BD':'v','\u03C1':'p','\u0391':'A','\u0392':'B','\u0395':'E','\u0396':'Z','\u0397':'H','\u0399':'I','\u039A':'K','\u039C':'M','\u039D':'N','\u039F':'O','\u03A1':'P','\u03A4':'T','\u03A5':'Y','\u03A7':'X'};
function _gTidy(t){
  return String(t||'')
    .replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g,' ')
    .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
    .replace(/[^\s]+/g, function(w){
      if(!/[\u0370-\u03FF\u0400-\u04FF\u0500-\u052F]/.test(w) || !/[A-Za-z\u00C0-\u024F]/.test(w)) return w;
      return w.replace(/[\u0370-\u03FF\u0400-\u04FF\u0500-\u052F]/g, function(c){ return _G_HOMO[c]||c; });
    });
}
function _cleanGeniusText(t){
  t=_gTidy(String(t||'').replace(/\r\n?/g,'\n'));
  // Descripcion de Genius ("… Read More") ANTES de la primera [Seccion] → fuera. Solo antes
  // de la primera seccion: nunca recorta una letra que diga "Read More".
  var sec=t.search(/\[[^\]\n]{1,60}\]/), rm=t.indexOf('Read More');
  if(rm>=0 && (sec<0 || rm<sec)) t=t.slice(rm+9);
  // Respaldo: encabezado "N Contributors · Translations · <Titulo> Lyrics" sin descripcion.
  t=t.replace(/^\s*\d+\s*Contributors?[\s\S]*?Lyrics\s*/, function(m){ return /\[[^\]\n]{1,60}\]/.test(m)?m:''; });
  return t
          .replace(/\d*Embed\s*$/,'')                                 // contador "…Embed" final
          .replace(/\[[^\]\n]{0,60}\]/g,function(m){return '\n'+m+'\n';})
          .replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n')
          .replace(/\n{3,}/g,'\n\n').replace(/^\s+|\s+$/g,'');
}
function parseGeniusHTML(html){
  if(!html) return null;
  try{
    var doc=new DOMParser().parseFromString(html, 'text/html');

    // 1. Modern Genius: data-lyrics-container
    var nodes=doc.querySelectorAll('[data-lyrics-container="true"]');
    if(!nodes.length) nodes=doc.querySelectorAll('[class*="Lyrics__Container"]');
    if(!nodes.length) nodes=doc.querySelectorAll('.lyrics');
    if(nodes && nodes.length){
      var parts=[]; for(var i=0;i<nodes.length;i++) parts.push(_geniusNodeText(nodes[i]));
      var t=_cleanGeniusText(parts.join('\n')); if(t) return t;
    }

    // 2. JSON-LD schema (schema.org MusicRecording)
    var ldEl=doc.querySelector('script[type="application/ld+json"]');
    if(ldEl){ try{ var ld=JSON.parse(ldEl.textContent||'{}'); if(ld.lyrics&&ld.lyrics.text){ var lt=_cleanGeniusText(ld.lyrics.text); if(lt) return lt; } }catch(e){} }

    // 3. Inertia / SSR JSON embedded in <div id="app" data-page="...">
    var appEl=doc.querySelector('#app[data-page]');
    if(appEl){ try{
      var pg=JSON.parse(appEl.getAttribute('data-page')||'{}');
      var lyrObj=pg&&pg.props&&pg.props.song&&pg.props.song.lyrics_state;
      if(lyrObj&&lyrObj.body&&lyrObj.body.plain){ var pt=_cleanGeniusText(lyrObj.body.plain); if(pt) return pt; }
    }catch(e){} }

    // 4. Regex fallback: lyrics_body in JSON script
    var sm=html.match(/"lyrics_body"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if(sm){ try{ var rb=JSON.parse('"'+sm[1]+'"'); var ct=_cleanGeniusText(rb); if(ct) return ct; }catch(e){} }

    return null;
  }catch(e){ return null; }
}

// ─── UTILS ───
function fmtClock(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60); return p2(m)+':'+p2(sec); }
function fmtTimer(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+':'+p2(cs); }
function fmtTip(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+'.'+p2(cs); }
function toSRT(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60),ms=Math.floor((s%1)*1000); return p2(h)+':'+p2(m)+':'+p2(sec)+','+p3(ms); }
function p2(n){ return String(Math.floor(n)).padStart(2,'0'); }
function p3(n){ return String(n).padStart(3,'0'); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Igual que LMG: la leyenda fija (cancion actual) va DEBAJO del timer (#tChannel); los
// avisos temporales salen ARRIBA (#tStatus) y se desvanecen. Nunca el toast flotante de
// abajo (tapaba la timeline), salvo que la barra aun no exista.
// (Se declara al final del script: conserva lo que setLegend ya guardo durante el arranque.)
var _legendBase=(typeof _legendBase==='string')?_legendBase:'';
function setLegend(msg){ _legendBase=(msg||'').trim(); var c=document.getElementById('tChannel'); if(c) c.textContent=_legendBase; }
function toast(msg,ms){
  var st=document.getElementById('tStatus');
  if(st){ st.textContent=msg; st.classList.add('on'); clearTimeout(st._t); st._t=setTimeout(function(){ st.classList.remove('on'); st.textContent=''; }, ms||4000); return; }
  var t=document.getElementById('toast'); if(t){ t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); },ms||2200); }
}
</script>
