<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' file: https://lrclib.net https:; media-src blob: file: *; img-src 'self' file: data:;">
<title>Verso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── design tokens ── */
  --bg:#0E0E0E;                       /* web; en AE #141414 (html.ae-host) */
  --container:#1e1e1e;
  --panel:#0E0E0E;                     /* lyrics + timeline panels (darker than side panels) */
  --track:#191919;
  --accent:#8a8a8a;                    /* gris opaco (antes indigo) */
  --accent35:rgba(138,138,138,.35);
  --accent25:rgba(138,138,138,.22);
  --accent50:rgba(138,138,138,.5);
  --btnbox:#191919;                    /* sub-container behind the button pills */
  --inact:rgba(255,255,255,.5);        /* inactive button icon + text */
  --title:rgba(255,255,255,.7);
  --text:#e9e9e9;
  --text-dim:rgba(255,255,255,.45);
  --rad:16px;
  --rad-pill:999px;
  /* ── legacy tokens (modals/menus) ── */
  --p1:#171717;--p2:#1f1f1f;--p3:#212121;--p4:#3a3a3a;--p5:#444;
  --ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.12);
  --tx:#e9e9e9;--tx2:#9a9a9a;--tx3:#6a6a6a;
  --bl:#8a8a8a;--bl2:#a8a8a8;--bl-dim:rgba(138,138,138,.15);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}

/* ─── APP SHELL ─── */
.app{height:100vh;display:flex;flex-direction:column;background:var(--bg);padding:14px}
.workspace{flex:1;display:flex;min-height:0;min-width:0}
.right-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}   /* lyrics on top, timeline below */

/* ─── RESIZERS ─── */
.rsz-h{width:14px;flex-shrink:0;cursor:col-resize;display:flex;align-items:center;justify-content:center}
.rsz-h::after{content:'';width:2px;height:36px;border-radius:2px;background:transparent;transition:background .15s}
.rsz-h:hover::after,.rsz-h.drag::after{background:var(--accent)}
.rsz-v{height:14px;flex-shrink:0;cursor:row-resize;display:flex;align-items:center;justify-content:center;margin:0 2px}
.rsz-v::after{content:'';height:2px;width:36px;border-radius:2px;background:transparent;transition:background .15s}
.rsz-v:hover::after,.rsz-v.drag::after{background:var(--accent)}

/* ─── SONGS PANEL ─── */
.songs{width:330px;flex-shrink:0;background:var(--container);border-radius:var(--rad);display:flex;flex-direction:column;overflow:hidden;position:relative}
/* refresh button (AE only) — re-read the project comps into the channel list */
.songs-refresh{position:absolute;top:8px;right:10px;z-index:8;width:28px;height:28px;border-radius:8px;background:var(--track);border:none;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.songs-refresh:hover{background:#3a3a3a;color:#fff}
#btnMasterClear:hover{background:rgba(224,102,102,.18);color:#e06666}
.songs-refresh svg{width:15px;height:15px}
.songs-refresh.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.songs-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;-ms-overflow-style:none}
.songs-list::-webkit-scrollbar{width:0;height:0;display:none}

.channel{background:#242424;border-radius:14px;padding:9px 11px;cursor:pointer;border:1.5px solid transparent;transition:background .25s ease,border-color .2s ease,opacity .3s ease}
.channel:hover{background:#2c2c2c}
.channel.dim{opacity:.4}                 /* incomplete (missing artist/song/lyrics) → dimmed */
.channel.dim:hover{opacity:.72}
.ch-head{display:flex;align-items:center;gap:10px}
.ch-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ch-meta{flex:1;min-width:0}
.ch-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ch-status{width:24px;height:24px;border-radius:50%;display:none;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);background:rgba(255,46,99,.16)}  /* blue check, only when lyrics loaded */
.channel.loaded .ch-status{display:flex}
.ch-status svg{width:13px;height:13px}

.ch-editor{display:flex;flex-direction:column;gap:8px;max-height:0;opacity:0;margin-top:0;overflow:hidden;transition:max-height .45s cubic-bezier(.16,1,.3,1),opacity .35s ease,margin-top .45s cubic-bezier(.16,1,.3,1)}
.channel.expanded .ch-editor{max-height:1600px;opacity:1;margin-top:10px}   /* tope alto: el textarea (resize:vertical) puede agrandarse sin recortarse */
.ch-clear{align-self:flex-end;background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:4px 7px;border-radius:7px;transition:.12s}
.ch-clear:hover{color:#e06666;background:rgba(224,102,102,.1)}
.ch-clear svg{width:11px;height:11px}
.ch-inputs{display:flex;gap:8px}
.ch-in,.ch-lyr{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;outline:none;transition:border-color .15s,background .15s}
.ch-in::placeholder,.ch-lyr::placeholder{color:rgba(255,255,255,.42)}
.ch-in:focus,.ch-lyr:focus{border-color:var(--accent);background:rgba(255,255,255,.07)}
.ch-in{flex:1;min-width:0;height:30px;border-radius:9px;font-size:12px;padding:0 10px}
.ch-lyr{width:100%;max-width:100%;min-height:150px;border-radius:10px;font-size:12px;padding:9px 11px;resize:vertical;line-height:1.6;font-family:inherit;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.ch-lyr::-webkit-scrollbar{width:0;height:0;display:none}

/* ─── LYRICS PANEL ─── */
.lyrics{flex:1;min-width:200px;background:var(--panel);border-radius:var(--rad);position:relative;overflow:hidden;display:flex;flex-direction:column;margin-left:0}
.lyr-title{position:absolute;top:0;left:0;right:0;text-align:center;padding:20px 24px 14px;z-index:4;pointer-events:none}
.lyr-song{font-size:16px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr-artist{font-size:13px;color:var(--text-dim);margin-top:2px}
.t-icon.spinning svg{animation:spin .8s linear infinite}
.lyr-stage{flex:1;position:relative;overflow:hidden;cursor:grab}
.lyr-stage.grabbing{cursor:grabbing}
.lyr-flow{position:absolute;left:0;right:0;top:0;text-align:center;padding:46% 30px;transition:transform .55s cubic-bezier(.22,.61,.36,1);will-change:transform}
.lyr-flow.nodrift{transition:none}
.lyr-line{font-size:17.5px;font-weight:400;line-height:1.6;cursor:pointer;text-align:center}
.lyr-line:hover .lk{filter:brightness(1.3)}
.lk{display:inline-block;color:rgba(255,255,255,.25);transition:color .3s ease,font-weight .15s ease}
/* [Verse] / [Chorus] / [Bridge]… : siempre VISIBLES como referencia, pero INACTIVAS —
   no se clican, no se seleccionan, no se marcan y nunca entran al SRT. */
.lyr-line.section{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;cursor:default;user-select:none;pointer-events:none;margin-top:.85em;margin-bottom:.15em}   /* breathing room between section blocks */
.lyr-flow .lyr-line.section:first-child{margin-top:0}
.lyr-line.section .lk{color:rgba(255,255,255,.42)}
.lyr-line.section:hover .lk{filter:none}
.lyr-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;text-align:center;padding:0 30px;line-height:1.7}
.lyr-fade{position:absolute;left:0;right:0;z-index:3;pointer-events:none}
.lyr-fade.top{top:0;height:120px;background:linear-gradient(var(--panel) 52%,rgba(20,20,20,0))}
.lyr-fade.bot{bottom:0;height:70px;background:linear-gradient(rgba(20,20,20,0),var(--panel) 72%)}

/* ─── TIMELINE ZONE ─── */
.timeline-zone{flex-shrink:0;background:var(--panel);border-radius:var(--rad);padding:10px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}   /* own container like the other panels; clips the playhead */
.tl-wrap{position:relative;height:22px;width:100%;flex:1;cursor:pointer}        /* scrub band — left-drag = playhead; middle-drag or wheel = navigate */
.tl-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:6px;background:var(--track);border-radius:var(--rad-pill);overflow:hidden}
#tlMarkers{position:absolute;inset:0;pointer-events:none}
.tl-fade-x{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;z-index:3;display:none}   /* only shown when zoomed in */
.tl-wrap.zoomed .tl-fade-x{display:block}
.tl-fade-x.l{left:0;background:linear-gradient(to right,var(--track),rgba(48,48,48,0))}
.tl-fade-x.r{right:0;background:linear-gradient(to left,var(--track),rgba(48,48,48,0))}
.tl-marker{position:absolute;top:0;height:100%;background:#b8b8b8;border-radius:var(--rad-pill);pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.3)}   /* gris claro, sin llegar a blanco */
.tl-marker.sel{filter:brightness(1.15);box-shadow:0 0 0 2px rgba(255,255,255,.28);z-index:5}
/* resize handles that appear inside a SELECTED marker, near each end */
.tl-handle{position:absolute;top:50%;transform:translateY(-50%);width:2.5px;height:100%;background:#fff;border-radius:2px;cursor:ew-resize;z-index:9;box-shadow:0 0 3px rgba(0,0,0,.7)}
.tl-handle.l{left:3px}.tl-handle.r{right:3px}
/* Playhead: just a tall white line; constant length at any zoom, only its WIDTH thins on zoom, with a track-coloured ring so it never blends into the markers */
.tl-playhead{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#fff;z-index:20;pointer-events:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 5px rgba(255,255,255,.45)}
/* Recuadro de tiempo al ajustar un marcador: position:fixed para escapar del overflow del
   timeline y quedar POR ENCIMA del panel de lyrics. Fondo muy opaco, texto blanco pequeño. */
.tl-tip{position:fixed;transform:translateX(-50%);background:rgba(16,16,16,.92);color:#fff;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:5px;white-space:nowrap;pointer-events:none;display:none;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.6)}
/* full-timeline overview, shown only when zoomed */
.tl-mini{position:relative;height:20px;background:#151515;border-radius:8px;overflow:hidden;cursor:pointer;display:none}
#tlMiniMarks{position:absolute;inset:0;pointer-events:none}
.tl-mini-mk{position:absolute;top:50%;transform:translateY(-50%);height:8px;min-width:2px;background:rgba(255,46,99,.5);border-radius:4px}
.tl-mini-vp{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.4);border-radius:6px;pointer-events:none}

.tl-times{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.t-timer{font-variant-numeric:tabular-nums;color:#fff;font-weight:700;font-size:13px;background:var(--track);padding:8px 12px;border-radius:11px;min-width:84px;text-align:center;user-select:none}
.lyr-controls{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px 12px;position:relative;z-index:5}
.t-time{font-variant-numeric:tabular-nums;color:#fff;font-size:13px;background:var(--track);padding:7px 13px;border-radius:11px;min-width:60px;text-align:center;user-select:none}
.t-btn{background:var(--track);border:none;color:var(--text);padding:8px 18px;border-radius:11px;cursor:pointer;font-size:13px;transition:background .12s}
.t-btn:hover{background:#3a3a3a}
.t-rate{min-width:42px;position:relative}
.t-icon{width:36px;height:36px;background:var(--track);border:none;color:var(--text-dim);border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.t-icon:hover{background:#3a3a3a;color:var(--text)}
.t-icon svg{width:15px;height:15px}
/* Speed menu — expands horizontally to the LEFT, same easing as the song-panel containers */
.rate-menu{position:fixed;display:flex;flex-direction:row;align-items:center;gap:4px;background:var(--track);border-radius:11px;padding:4px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:0;opacity:0;overflow:hidden;pointer-events:none;white-space:nowrap;transition:max-width .3s cubic-bezier(.4,0,.2,1),opacity .25s ease,padding .3s cubic-bezier(.4,0,.2,1)}
.rate-menu.open{max-width:440px;opacity:1;pointer-events:auto}
.rate-item{padding:7px 14px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;text-align:center;white-space:nowrap;transition:background .1s}
.rate-item:hover{background:#3d3d3d}
.rate-item.cur{background:var(--accent);color:#fff}

/* ─── AE CONTROL BAR (inside After Effects only) ─── */
.lyr-controls.ae{justify-content:space-between}
.lc-left,.lc-right{display:flex;align-items:center;gap:8px}
.t-timer-flat{font-variant-numeric:tabular-nums;color:#fff;font-weight:500;font-size:14px;user-select:none;letter-spacing:.02em;cursor:pointer;transition:color .15s}
.t-timer-flat.rate15{color:var(--accent)}
/* channel avatar as channel icon image */
.ch-av-img{background-size:cover;background-position:center;background-repeat:no-repeat}
.ch-av-note{background:var(--track)}
.ch-av-note svg{width:20px;height:20px;color:#a8a8a8}
/* Verso single-channel: no left songs panel — the channel container is a popup */
#songsPanel,#rszH{display:none !important}
#chPop .modal{width:340px;max-width:92vw;padding:14px;position:relative}
#chPop .songs-list{padding:0;gap:0;overflow:visible}
#chPop .channel{cursor:default;border:none;background:transparent;padding:0}
#chPop .channel .ch-editor{max-height:none;opacity:1;margin-top:12px;overflow:visible}
/* close (×) button — top-right of the container popup */
.chpop-x{position:absolute;top:12px;right:12px;z-index:10;width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:none;border-radius:8px;background:var(--track);color:var(--text-dim);font-size:19px;line-height:1;cursor:pointer;transition:background .12s,color .12s}
.chpop-x:hover{background:var(--p5,#444);color:#fff}
/* keep the channel head clear of the × button */
#chPop .ch-head{padding-right:34px}
/* TH thumbnail preview + Thumbnail button */
.ch-thumb{width:100%;border-radius:9px;margin-top:2px;display:block;border:1px solid rgba(255,255,255,.1)}
.ch-thumb-btn:hover{color:var(--accent);background:rgba(255,46,99,.12)}

/* ─── AE/TOUCH v8: 3-zone control bar (left actions / centre timer / right actions) ─── */
.lyr-controls.ae{justify-content:space-between;gap:8px;padding:10px 16px 12px}
.lc-side{display:flex;align-items:center;gap:8px;flex:1}
.lc-right{justify-content:flex-end}
.lc-center{display:flex;align-items:center;gap:8px;flex-shrink:0}
.t-center-timer{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px}
/* inactivo = blanco tenue (opaco); acelerado (rate15) = blanco pleno — paridad con LMG/CM */
.t-center-timer .t-timer-flat{font-size:15px;color:rgba(255,255,255,.5);transition:color .2s ease}
.t-center-timer .t-timer-flat.rate15{color:#fff}
/* status legend ABOVE the timer, faint */
.t-center-timer .t-status{font-size:11.5px;color:var(--text-dim);margin-bottom:2px;min-height:14px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s ease}
.t-center-timer .t-status.base{color:var(--text-dim);opacity:.55}
.t-center-timer .t-status.on{opacity:.5}
.t-center-timer .t-dots{display:flex;gap:3px;justify-content:center;align-items:center;height:6px;margin-bottom:2px;opacity:0;transition:opacity .25s ease}
.t-center-timer .t-dots.on{opacity:1}
.t-center-timer .t-dots span{width:4px;height:4px;border-radius:50%;background:#fff}
/* Barra de progreso (ancho fijo + margin auto = centrado exacto bajo el timer en Win y Mac,
   no depende del ancho flex, que se resuelve distinto entre plataformas). */
.t-center-timer .t-pbar{width:72px;max-width:72px;height:2px;margin:3px auto 0;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .2s ease}
.t-center-timer .t-pbar.on{opacity:1}
.t-center-timer .t-pbar>i{display:block;height:100%;width:0;border-radius:2px;background:#fff;transition:width .18s linear}
.t-center-timer .t-pbar.indet>i{width:35%;animation:pbarIndet 1s ease-in-out infinite}
@keyframes pbarIndet{0%{margin-left:-35%}100%{margin-left:100%}}
/* Leyenda fija (cancion) DEBAJO del timer — igual que LMG. */
.t-center-timer .t-channel{font-size:11px;color:var(--text-dim);opacity:.6;margin-top:2px;min-height:13px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* Verso 2: speed selectors flanking the timer (no containers, semi-opaque) */
.rate-wrap{display:flex;align-items:center;justify-content:center}
/* speed selectors: always visible, small, flanking the timer */
.rate-side{display:flex;align-items:center;gap:10px}
.rate-slow{justify-content:flex-end;padding-right:12px}
.rate-fast{padding-left:12px}
.rate-n{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);cursor:pointer;white-space:nowrap;transition:color .12s}
.rate-n:hover{color:rgba(255,255,255,.8)}
.rate-n.cur{color:var(--accent)}
.t-icon.sq{width:34px;height:34px;padding:0;font-size:12px;font-weight:600;flex-shrink:0}
.t-icon.sq svg{width:17px;height:17px}
.spd.on{background:var(--accent);color:#fff}
/* button + upward hover menu */
.btn-stack{position:relative;display:flex}
.stack-menu{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(8px) scale(.96);transform-origin:bottom center;display:flex;flex-direction:column-reverse;gap:5px;padding-bottom:9px;opacity:0;pointer-events:none;transition:opacity .26s cubic-bezier(.22,1,.36,1),transform .34s cubic-bezier(.22,1,.36,1)}
.btn-stack:hover .stack-menu{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.stack-item{background:var(--track);color:var(--text);border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:background .12s,color .12s}
.stack-item:hover{background:#3d3d3d}
.stack-item.cur{background:var(--accent);color:#fff}
.stack-item.sync:hover{background:#FF2E63;color:#fff}
.stack-item.srt:hover{background:#7a3df0;color:#fff}
/* Verso 2: hover-expanding labelled buttons */
.t-exp{display:inline-flex;align-items:center;height:34px;background:var(--track);border:none;color:var(--text-dim);border-radius:11px;cursor:pointer;overflow:hidden;flex-shrink:0;padding:0;transition:color .12s,background .12s}
.t-exp .t-ico{flex:0 0 34px;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.t-exp .t-ico svg{width:17px;height:17px}
.t-exp .t-label{max-width:0;opacity:0;white-space:nowrap;font-size:12px;font-weight:600;overflow:hidden;padding:0;transition:max-width .2s cubic-bezier(.22,1,.36,1),opacity .15s,padding .2s}
.t-exp:hover{color:#fff;background:#3a3a3a}
.t-exp:hover .t-label{max-width:120px;opacity:1;padding-right:12px}
.t-exp.exp-l:hover .t-label{padding-right:0;padding-left:12px}
/* keep the button expanded while hovering ANYWHERE in its stack (so the menu stays reachable/open) */
.btn-stack:hover .t-exp{color:#fff;background:#3a3a3a}
.btn-stack:hover .t-exp .t-label{max-width:120px;opacity:1;padding-right:12px}
.btn-stack:hover .t-exp.exp-l .t-label{padding-right:0;padding-left:12px}
.t-exp.ae-import:hover{background:#7a3df0;color:#fff}
.t-exp.btn-render:hover{background:#2e9e5b;color:#fff}
/* line-toggle items (above the Genius button) */
.line-tog{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 12px}
.line-tog svg{width:15px;height:15px}
.line-tog.cur{background:var(--accent);color:#fff}
/* Genius loader: inline link input that expands on hover/focus (lens icon loads it) */
.genius-inp{max-width:0;width:var(--gw,120px);min-width:0;opacity:0;border:none;background:transparent;color:#fff;font-size:12px;outline:none;padding:0;transition:max-width .25s cubic-bezier(.22,1,.36,1),opacity .2s,padding .25s}
.genius-inp::placeholder{color:rgba(255,255,255,.4)}
.btn-stack:hover .genius-exp .genius-inp,.genius-exp:focus-within .genius-inp{max-width:var(--gw,120px);opacity:1;padding-left:12px}

<script>
// ─── AVISO AL SALIR / RECARGAR (solo web) ───
// Cmd+R (Mac), Ctrl+R / F5 (Windows) y "atras" (boton, gesto, Alt+Flecha, boton del mouse)
// muestran este aviso en vez de recargar o salir. Siempre en ingles:
//   "Are you trying to leave?"  [ Accept ]
//   Accept -> recarga o sale, segun lo que se hizo.
//   Clic fuera de la tarjeta o Esc -> se queda, sin recargar.
// Lo que el navegador NO deja interceptar con un aviso propio (su boton de recargar, cerrar la
// pestana, escribir otra direccion) cae en el aviso nativo del navegador (beforeunload).
// "Atras": se agrega una entrada de historial propia (con la misma URL) tras la primera
// interaccion; al volver a ella, el aviso aparece y la pagina sigue intacta.
// Va ANTES del script principal para que su keydown corra primero y, con el aviso abierto,
// ninguna tecla (Space, Enter...) llegue al resto del panel.
// En After Effects (CEP) no hace nada.
(function(){
  if(window.__adobe_cep__) return;
  var IS_MAC_LG=/mac|iphone|ipad|ipod/i.test(navigator.platform||'')||/Mac OS X/i.test(navigator.userAgent||'');
  var TITLE='Are you trying to leave?', ACCEPT='Accept';

  var open=false, action=null, leaving=false, unloading=false, armed=false, depth=0;
  var el=null, card=null, okB=null, downOnBg=false, closeTimer=null, prevFocus=null;

  // Profundidad = cuantas entradas de historial de Verso hay antes de esta (se guarda en el
  // propio historial y sobrevive a la recarga). Accept en "atras" salta todas de una vez.
  function readDepth(){ try{ var s=history.state; return (s&&typeof s.vgDepth==='number')?s.vgDepth:-1; }catch(e){ return -1; } }
  depth=readDepth();
  if(depth<0){ depth=0; try{ history.replaceState({vgDepth:0},'',location.href); }catch(e){} }

  function arm(){
    if(armed||open||leaving) return;
    // Solo con interaccion real: Chrome salta entradas de historial agregadas sin ella.
    try{ if(navigator.userActivation && !navigator.userActivation.isActive) return; }catch(e){}
    try{ history.pushState({vgDepth:depth+1},'',location.href); depth++; armed=true; }catch(e){}
  }

  function build(){
    if(el) return;
    el=document.createElement('div'); el.className='vlg-bg'; el.id='vlgBg';
    el.innerHTML='<div class="vlg-card" role="alertdialog" aria-modal="true" aria-labelledby="vlgTitle" tabindex="-1" lang="en">'+
      '<div class="vlg-title" id="vlgTitle"></div>'+
      '<button type="button" class="vlg-btn" id="vlgAccept"></button></div>';
    card=el.firstChild; okB=el.querySelector('#vlgAccept');
    el.querySelector('#vlgTitle').textContent=TITLE; okB.textContent=ACCEPT;
    okB.addEventListener('click',function(e){ e.stopPropagation(); confirmLeave(); });
    // Clic FUERA de la tarjeta = quedarse (solo si el clic empezo y termino fuera).
    var downEv=window.PointerEvent?'pointerdown':'mousedown';
    el.addEventListener(downEv,function(e){ downOnBg=(e.target===el); });
    el.addEventListener('click',function(e){ if(e.target===el && downOnBg) stay(); downOnBg=false; });
    document.body.appendChild(el);
  }

  function show(kind){
    action=kind;
    if(open) return;
    build(); open=true;
    clearTimeout(closeTimer);
    el.classList.remove('vlg-out'); el.style.display='flex';
    void el.offsetWidth;                     // reflow: que la animacion de entrada arranque desde 0
    el.classList.add('vlg-in');
    prevFocus=document.activeElement;
    try{ card.focus({preventScroll:true}); }catch(e){ try{ card.focus(); }catch(e2){} }
  }
  function hide(instant){
    if(!el) return;
    open=false; clearTimeout(closeTimer);
    el.classList.remove('vlg-in');
    if(instant){ el.classList.remove('vlg-out'); el.style.display='none'; }
    else { el.classList.add('vlg-out'); closeTimer=setTimeout(function(){ el.style.display='none'; el.classList.remove('vlg-out'); },200); }
    try{ if(prevFocus && prevFocus!==document.body && prevFocus.focus) prevFocus.focus({preventScroll:true}); }catch(e){}
    prevFocus=null;
  }
  // Clic fuera / Esc: la pagina sigue igual. Si venia de "atras", se re-arma la entrada.
  function stay(){ var a=action; action=null; hide(false); if(a==='back') arm(); }
  // Accept: hace lo que se intento (recargar o salir), sin volver a preguntar.
  function confirmLeave(){
    var a=action; leaving=true;
    if(a==='reload'){ location.reload(); return; }
    if(a==='back'){
      try{ history.go(-(depth+1)); }catch(e){}
      // No habia pagina anterior (pestana nueva): no hay a donde salir; cerrar y re-armar.
      setTimeout(function(){ if(unloading) return; leaving=false; action=null; hide(false); arm(); },700);
      return;
    }
    leaving=false; stay();
  }

  // Teclas: Cmd+R (Mac) / Ctrl+R / F5 (+Shift = recarga forzada). Con el aviso abierto se
  // bloquean todas las demas teclas del panel; Esc = quedarse; Tab enfoca Accept.
  window.addEventListener('keydown',function(e){
    var k=e.key||'';
    var isReload=(k==='F5'||e.keyCode===116) ||
      ((IS_MAC_LG?e.metaKey:e.ctrlKey) && (IS_MAC_LG||!e.altKey) && (e.code==='KeyR'||k.toLowerCase()==='r'));   // Win: sin Alt (AltGr = Ctrl+Alt)
    if(open){
      if(k==='Escape'||k==='Esc'){ e.preventDefault(); e.stopImmediatePropagation(); stay(); return; }
      if(k==='Tab'){ e.preventDefault(); e.stopImmediatePropagation(); okB.focus(); return; }
      if(document.activeElement===okB && !isReload && (k==='Enter'||k===' '||e.code==='Space'||e.code==='NumpadEnter')){ e.stopImmediatePropagation(); return; }   // Accept enfocado: se presiona normal
      e.preventDefault(); e.stopImmediatePropagation(); return;
    }
    if(isReload){ e.preventDefault(); e.stopImmediatePropagation(); arm(); show('reload'); return; }
    if(k!=='Escape' && k!=='Shift' && k!=='Control' && k!=='Alt' && k!=='Meta') arm();
  },true);

  // Primera interaccion = se arma la proteccion de "atras".
  ['pointerdown','mousedown','touchend','click'].forEach(function(t){ window.addEventListener(t,function(){ arm(); },true); });

  // "Atras" (o adelante) dentro de las entradas de Verso.
  window.addEventListener('popstate',function(e){
    if(leaving) return;
    var s=e.state, d=(s&&typeof s.vgDepth==='number')?s.vgDepth:0, prev=depth;
    depth=d;
    if(d>prev){ armed=true; if(open && action==='back'){ action=null; hide(false); } return; }   // "adelante": se deshizo el atras
    armed=false;
    show('back');
  });

  // Respaldo nativo: boton de recargar del navegador, cerrar pestana, escribir otra URL.
  window.addEventListener('beforeunload',function(e){
    if(leaving){ unloading=true; return; }
    e.preventDefault(); e.returnValue=''; return '';
  });

  // Volver a la pagina desde la cache del navegador (atras/adelante): estado limpio.
  window.addEventListener('pageshow',function(e){
    if(!e.persisted) return;
    leaving=false; unloading=false; armed=false; action=null; hide(true);
    var d=readDepth(); depth=d<0?0:d;
  });
})();
</script>
<script>
// ─── CEP BRIDGE ───
// window.__adobe_cep__ exists ONLY inside a CEP host (After Effects). That is our
// single source of truth for "running inside AE" — so the AE-only UI (the import
// buttons) stays hidden on the web even if CSInterface.js happens to be served.
var csInterface = null;
if (window.__adobe_cep__ && typeof CSInterface !== 'undefined') {
  try { csInterface = new CSInterface(); } catch(e){ csInterface = null; }
}
var IN_AE = !!csInterface;   // single source of truth for "running inside After Effects"
var IS_MAC = (navigator.platform||'').toLowerCase().indexOf('mac')>=0 || /mac/i.test(navigator.userAgent||'');
// Touch device = iPad / iPhone (web on a touch screen). AE/desktop-web use the mouse.
var IS_TOUCH = (('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0) && !IN_AE;
try{
  document.body.classList.toggle('ae', IN_AE);
  document.body.classList.toggle('touch', IS_TOUCH);
  document.body.classList.toggle('web', !IN_AE && !IS_TOUCH);
}catch(e){}

// ─── VIDEO / SHORT MODE ───
// Two interfaces in one. Default = Video (targets "Song" / "Lyrics" / "TH").
// Short = purple accents + narrow vertical lyrics stage; every action targets the
// project items whose name contains "Short" (Short Song / Short Lyrics / Short).
// Nov 2026 (Verso Alpha): en AE el modo Short es el UNICO (sin toggle Video/Short). Todas las
// acciones hacen lo de video Y lo Short que exista en el proyecto; lo que no exista se ignora.
// En la web no cambia nada (false).
var SHORT_MODE=IN_AE;
// Per-interface details (Artist / Song). Video uses ch.artist/ch.song; Short uses
// ch.shortArtist/ch.shortSong. These accessors pick the right bucket for the mode.
// Sin toggle (nov 2026) Video y Short son la MISMA cancion: en Short se escriben ambos
// juegos (artist/song y shortArtist/shortSong) para que la TH de video y la Short reciban
// siempre el mismo titulo.
function chArtist(ch){ return (ch ? (SHORT_MODE ? (ch.shortArtist||ch.artist) : ch.artist) : '') || ''; }
function chSong(ch){   return (ch ? (SHORT_MODE ? (ch.shortSong||ch.song)     : ch.song)   : '') || ''; }
function setChArtist(ch,v){ if(!ch) return; if(SHORT_MODE){ ch.shortArtist=v; ch.artist=v; } else ch.artist=v; }
function setChSong(ch,v){   if(!ch) return; if(SHORT_MODE){ ch.shortSong=v;   ch.song=v; }   else ch.song=v; }
function setMode(short){
  short=!!short;
  if(short===SHORT_MODE){ return; }
  SHORT_MODE=short;
  try{ document.body.classList.toggle('short-mode', SHORT_MODE); }catch(e){}
  // reflect the active pill (Video = 1st, Short = 2nd) and glide the knob to it
  try{
    var pills=document.querySelectorAll('.mode-pill');
    if(pills[0]) pills[0].classList.toggle('on', !SHORT_MODE);
    if(pills[1]) pills[1].classList.toggle('on', SHORT_MODE);
    var mt=document.getElementById('modeToggle'); if(mt&&mt._slideRest) mt._slideRest();
  }catch(e){}
  // refresh everything that shows this mode's data / accent colour.
  try{ syncTitle(); renderChannels(); }catch(e){}
  try{ renderLyricsFlow(); updateLyricHighlight(AEL.currentTime||0); tlRefresh(); }catch(e){}
  // Pull this mode's song filename (Video vs Short) and auto-fill Artist/Song live.
  try{ if(IN_AE){ ensureHost(function(ok){ if(ok) aeLoadSong(getActive(), false, true); }); } }catch(e){}
  try{ toast(SHORT_MODE?'Short mode':'Video mode'); }catch(e){}
}

// on mouse-leave, returns to the container's "resting" button (restFn) — switch-like.

// Verso 2: speed selectors flanking the timer (slow left, fast right). No containers,
// semi-opaque numbers; the selected one turns blue. 1x = none selected.
// La velocidad es GLOBAL: se conserva al cambiar de cancion/canal y entre sesiones, para
// no tener que reajustarla cada vez. El timer cicla 1× → 1.5× → 2.1× → 3× → 1×.
var currentRate=1;
try{ var _sr=parseFloat(localStorage.getItem('verso_rate')); if(_sr>0&&_sr<=3) currentRate=_sr; }catch(e){}
// ─── Barra de progreso (ancho del timer). Para procesos largos: avanza con el tiempo
// (creep asintotico) y se completa al terminar. Si hay conteo real, setProgress(frac) manda.
function _pbarHide(p){ if(!p) return; p.classList.remove('on'); if(p.firstChild) p.firstChild.style.width='0'; }
function startProgress(estMs){
  var p=document.getElementById('tPbar'); if(!p) return; var bar=p.firstChild;
  clearTimeout(p._h); clearTimeout(p._safety); if(p._raf){ cancelAnimationFrame(p._raf); p._raf=null; }
  p.classList.add('on'); bar.style.width='2%';
  var t0=Date.now(), est=estMs||7000;
  (function creep(){ var e=(Date.now()-t0)/est, f=Math.min(0.92, 1-Math.exp(-e*1.6)); bar.style.width=(f*100).toFixed(1)+'%'; p._raf=requestAnimationFrame(creep); })();
  // Red de seguridad (se veia en Mac que la barra quedaba pegada): si ningun stopProgress la
  // cierra —dialogo cancelado, error, o un nuevo start que cancelo el ocultado— se oculta igual.
  // El tope se reinicia en cada start/set, asi que procesos largos legitimos no se cortan antes.
  p._safety=setTimeout(function(){ if(p._raf){ cancelAnimationFrame(p._raf); p._raf=null; } _pbarHide(p); }, Math.max(15000,(est||0)+8000));
}
function setProgress(frac){
  var p=document.getElementById('tPbar'); if(!p) return; if(p._raf){ cancelAnimationFrame(p._raf); p._raf=null; }
  clearTimeout(p._safety); p._safety=setTimeout(function(){ _pbarHide(p); }, 15000);
  p.classList.add('on'); p.firstChild.style.width=(Math.max(0,Math.min(1,frac))*100).toFixed(1)+'%';
}
function stopProgress(){
  var p=document.getElementById('tPbar'); if(!p) return; if(p._raf){ cancelAnimationFrame(p._raf); p._raf=null; }
  clearTimeout(p._safety);
  p.firstChild.style.width='100%'; clearTimeout(p._h); p._h=setTimeout(function(){ _pbarHide(p); }, 450);   // llena y desaparece al completar
}
function toggleRate15(){
  var cur=currentRate||1, next;
  if(Math.abs(cur-1)<0.001) next=1.5;
  else if(Math.abs(cur-1.5)<0.001) next=2.1;
  else if(Math.abs(cur-2.1)<0.001) next=3;
  else next=1;
  currentRate=next;
  try{ localStorage.setItem('verso_rate', String(next)); }catch(e){}
  applyGlobalRate(); showSpeedDots(next);
}
// Puntos ENCIMA del timer indicando el nivel de velocidad; se desvanecen tras un momento.
function showSpeedDots(rate){
  var d=document.getElementById('tDots'); if(!d) return;
  var n = Math.abs(rate-1.5)<0.02?1 : Math.abs(rate-2.1)<0.02?2 : Math.abs(rate-3)<0.02?3 : 0;
  var h=''; for(var i=0;i<n;i++) h+='<span></span>'; d.innerHTML=h;
  clearTimeout(d._t);
  if(n>0){ d.classList.add('on'); d._t=setTimeout(function(){ d.classList.remove('on'); }, 1800); }
  else d.classList.remove('on');
}
// Cargar una cancion nueva resetea playbackRate a 1 → reaplicar la velocidad global.
function applyGlobalRate(){
  try{ if(Math.abs((AEL.playbackRate||1)-currentRate)>0.001) AEL.playbackRate=currentRate; }catch(e){}
  syncRateUI();
}

// ─── Verso 2: lines per timestamp (1 default / 2 / 3) ───
// Groups consecutive lyric lines so each timestamp covers up to N lines.
var linesPerStamp=1;
// Only changes how many lines the NEXT timestamp will cover/underline.
// Does NOT alter the lyrics text or remove existing markers.
function setLinesPerStamp(n){
  applyLinesPerStamp((linesPerStamp===n)?1:n);   // clicking the active one turns it back to 1
}
// Teclas 1-4 (fila de numeros o teclado numerico): fijan exactamente N lineas, sin alternar.
// Siempre arranca en 1 al cargar la pagina / abrir el panel (no se guarda en ningun lado).
function applyLinesPerStamp(n){
  n=Math.max(1,Math.min(4,n|0||1));
  linesPerStamp=n;
  syncLinesMenu();
  updateLyricHighlight(AEL.currentTime||0);   // no rebuild — just refresh (keeps painted lines)
  toast(linesPerStamp===1?'1 line per timestamp':(linesPerStamp+' lines per timestamp'));

  if(b3) b3.classList.toggle('cur', linesPerStamp===3);
  if(b4) b4.classList.toggle('cur', linesPerStamp===4);

// Returns the up-to-N stampable line indices starting at line index `from`.
function stampGroupFrom(from){
  var idxs=[], c=Math.max(0,from);
  while(idxs.length<linesPerStamp && c<lines.length){
    c=nextStampable(c); if(c>=lines.length) break;
    idxs.push(c); c++;
  }
  return idxs;
}
// Color by number of lines: 1=blue, 2=celeste, 3=magenta, 4=rosado.
// n=1 (default) uses the theme accent; 2/3/4-line groups keep distinct indicator colours.
// ACCENT_* mirror the CSS --accent so inline marker/karaoke colours match the theme.
var ACCENT='#b8b8b8', ACCENT_DIM='rgba(255,255,255,.5)', ACCENT_HI='rgba(255,255,255,.18)';   // gris claro, sin llegar a blanco (paridad con Verso LMG)
// Markers are ALWAYS indigo, regardless of how many lines the stamp groups.
function lineColor(){ return ACCENT; }
function lineColorDim(){ return ACCENT_DIM; }
function lineColorHi(){ return ACCENT_HI; }
// After deleting markers, continue stamping from AFTER the last remaining marker
// (so freed-up lines become stampable again and the order isn't broken).
function recomputeCurLine(){
  var maxLine=-1;
  for(var i=0;i<stamps.length;i++){ var ls=stampLineSet(stamps[i]); for(var k=0;k<ls.length;k++) if(ls[k]>maxLine) maxLine=ls[k]; }
  curLine=nextStampable(maxLine+1);
}

// Verso 2: import an external .srt file into THIS channel's Lyrics comp.
function importSRTFile(ev){
  if(ev) ev.stopPropagation();
  flashPill('btnImport');
  if(!csInterface){ toast('Only inside After Effects'); return; }
  var ch=getActive(); if(!ch){ toast('No channel'); return; }
  toast('Select the .srt file…');
  ensureHost(function(ok){
    if(!ok){ toast('Could not connect to the AE host'); return; }
    // UNA sola llamada: el .srt se abre y se importa dentro de ExtendScript. Antes el
    // contenido iba y volvia por el puente de CEP, que falla en silencio (devuelve vacio
    // -> "No response") cuando la letra trae caracteres no-ASCII (’ — … acentos).
    var opt={ styleLayerName:'Style Controler', fadeIn:0.3, fadeOut:0.3, lyricsBySuffix:true };
    var target=(ch.lyr||'Lyrics');
    var call='importSrtFileToComp('+JSON.stringify(target)+','+JSON.stringify(JSON.stringify(opt))+','+(SHORT_MODE?'true':'false')+')';
    function runSrt(){
      _evalDlg(call, function(result){
        if(!result){ toast('SRT: sin respuesta de AE (reabre el panel)', 8000); return; }
        if(result.indexOf('cancel:')===0){ toast('SRT: importacion cancelada', 4000); return; }
        if(result.indexOf('ok:')===0){ toast('✓ SRT importado · '+result.slice(3), 6000); }
        else { toast('SRT: '+(result.indexOf('err:')===0?result.slice(4):result), 8000); }
      });
    }
    // Si el host cargado por el manifest es una copia vieja sin la funcion, recargarlo.
    csInterface.evalScript('(typeof importSrtFileToComp==="function")?"1":"0"', function(has){
      if(has==='1'){ runSrt(); } else { _hostSrc=null; loadHostViaXHR(runSrt); }
    });
  });
}

var _holdId=null, _holdActive=false;
function _holdStart(fn){

    var dt=Math.min((now-prev)*0.001,0.05); prev=now;
    var vel=Math.min(5, 0.5+(now-t0)*0.003);

  }

  var s=getStampById(selArr[0]); if(!s) return;

    var newT=Math.max(0,s.time-step); if(newT===s.time) return;

  } else {
    var curLen=s.len!=null?s.len:markerLen(s,i);
    var newLen=shrink?Math.max(0.1,curLen-step):curLen+step;
    if(!shrink&&dur&&s.time+newLen>dur) newLen=dur-s.time;
    if(shrink?newLen>=curLen:newLen<=curLen) return;

function adjustMarkerPosition(dir, step){

var _hostReady=false, _hostSrc=null;
function _extBase(){
  try{
    var href=window.location.href;                 // e.g. file:///C:/.../extensions/v6/index.html
    var p=href.replace(/[#?].*$/,'').replace(/[^\/]*$/,''); // strip file name + query/hash
    p=p.replace(/^file:\/\/\//i,'').replace(/^file:\/\//i,'');
    return decodeURI(p);
  }catch(e){ return ''; }
}
function probeHost(cb){ if(!csInterface){ cb(false); return; } csInterface.evalScript('(typeof importLyricsToComp==="function" && typeof _hostVersion==="function")?"1":"0"', function(r){ cb(r==='1'); }); }
function loadHostViaXHR(done){
  // SIEMPRE via red (nunca reusar _hostSrc en cache): durante desarrollo/pruebas el archivo
  // cambia seguido y ExtendScript no relee solo porque el .jsx se edito en disco — reusar el
  // texto ya cargado dejaba acciones corriendo con logica vieja aunque el archivo ya estuviera
  // corregido. El costo (una peticion GET chica) es insignificante frente a la confiabilidad.
  try{
    var xhr=new XMLHttpRequest(); xhr.open('GET','jsx/host.jsx?ts='+Date.now(),true);
    xhr.onreadystatechange=function(){ if(xhr.readyState!==4) return;
      if(xhr.responseText && xhr.responseText.indexOf('function')!==-1){ _hostSrc=xhr.responseText; csInterface.evalScript(_hostSrc, function(){ done(); }); }
      else done();
    };
    xhr.onerror=function(){ done(); }; xhr.send();
  }catch(e){ done(); }
}
function loadHostViaPath(done){
  var ext=''; try{ ext=csInterface.getSystemPath(SystemPath.EXTENSION); }catch(e){}
  if(!ext) ext=_extBase();
  if(!ext){ done(); return; }
  var hp=(ext.replace(/[\/\\]+$/,'')+'/jsx/host.jsx').replace(/\\/g,'/');
  csInterface.evalScript('(function(){try{$.evalFile(new File("'+hp+'"));return "1";}catch(e){return "0";}})()', function(){ done(); });
}
// Run cb(true) once the CURRENT host.jsx is loaded. El motor de ExtendScript persiste
// entre acciones del panel y NO relee el archivo solo porque cambio en disco — por eso
// SIEMPRE re-evaluamos la fuente actual (XHR) en cada llamada, nunca nos quedamos con la
// version ya cargada. Sin esto, una correccion en host.jsx no se reflejaba hasta cerrar y
// reabrir el panel entero, dando la falsa impresion de que el fix "no funcionaba".
function ensureHost(cb){
  if(!csInterface){ cb(false); return; }
  loadHostViaXHR(function(){
    probeHost(function(ok){
      if(ok){ _hostReady=true; cb(true); return; }
      loadHostViaPath(function(){

      });
    });
  });
}

// ─── COPIAR / PEGAR SECCION (nov 2026) ───
// Clic en la pildora de una seccion COMPLETA ([Chorus], [Verse 1]...) copia sus timestamps:
// tiempos relativos al primero, largos recortados y lineas por timestamp. Cmd/Ctrl+V los pega
// desde el playhead en las siguientes lineas sin marcar (dentro de esa parte de la letra, sin
// pasar al siguiente separador), con las mismas duraciones; despues se sigue normal con Enter.
// Hover en la pildora ilumina las lineas que se copiarian. Se puede deshacer con Cmd/Ctrl+Z.
var _secClip=null;
function _secLinesOfStamp(s){ return (s.idxs&&s.idxs.length)?s.idxs:[s.lineIdx]; }

  if(!lines[si] || !isSection(lines[si])) return null;

  if(!idx.length) return {lines:[],stamps:[],complete:false};
  var lo=idx[0], hi=idx[idx.length-1], covered={}, mine=[];
  for(var k=0;k<stamps.length;k++){
    var ls=_secLinesOfStamp(stamps[k]), inSec=0;
    for(var q=0;q<ls.length;q++) if(ls[q]>=lo && ls[q]<=hi){ covered[ls[q]]=1; inSec++; }
    if(inSec) mine.push({s:stamps[k], n:inSec});
  }
  var complete=mine.length>0; for(var m=0;m<idx.length;m++) if(!covered[idx[m]]){ complete=false; break; }

}

function pasteSection(){
  if(!_secClip){ toast('Click a finished section label to copy it first'); return; }
  var ach=getActive(); if(!ach||!ach.audioURL||!dur){ toast('Load audio for this channel first'); return; }
  if(!lines.length){ toast('Add lyrics first'); return; }
  var t0=AEL.currentTime||0, lastT=-1;
  for(var i=0;i<stamps.length;i++) if(stamps[i].time>lastT) lastT=stamps[i].time;
  if(t0<=lastT+0.05){ toast('Move the playhead after the last timestamp to paste '+_secClip.name); return; }
  var li=nextStampable(curLine);
  if(li>=lines.length){ toast('All lines stamped'); return; }
  var end=li; while(end<lines.length && !isSection(lines[end])) end++;   // no pasar al siguiente separador
  pushUndo();
  var added=0, groups=(typeof stampLineSet==='function');
  for(var k=0;k<_secClip.items.length;k++){
    var it=_secClip.items[k], t=t0+it.dt; if(t>=dur-0.05) break;
    var want=groups?Math.max(1,it.n):1, grp=[], c=li;
    while(grp.length<want && c<end){ grp.push(c); c++; }
    if(!grp.length) break;
    var st={id:++stampSeq, lineIdx:grp[0], time:t}; if(groups) st.idxs=grp;
    if(it.len!=null) st.len=Math.max(0.1, Math.min(it.len, dur-t));
    stamps.push(st); li=c; added++;
  }
  if(!added){ undoStack.pop(); toast('Nothing to paste here'); return; }
  stamps.sort(function(a,b){ return a.time-b.time; });
  curLine=nextStampable(li);
  if(typeof collapseDotsSel==='function') collapseDotsSel();
  saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0);
  toast('Pasted '+_secClip.name+' · '+added+' timestamps');
}

function stampLineSet(s){ return (s.idxs&&s.idxs.length)?s.idxs:[s.lineIdx]; }
function updateLyricHighlight(t){
  var ch=getActive(); if(!ch||!ch.lines.length) return;
  // Active stamp = the one whose window contains the current time (highlights ALL its lines).
  var activeStamp=null;
  for(var k=0;k<stamps.length;k++){
    var st=stamps[k].time, ln=(stamps[k].len!=null)?stamps[k].len:((k+1<stamps.length)?(stamps[k+1].time-st):(dur?dur-st:3)), en=st+Math.max(0.05,ln);
    if(t>=st && t<en){ activeStamp=stamps[k]; break; }
  }
  var activeIdxs=activeStamp?stampLineSet(activeStamp):[];

  var flow=document.getElementById('lyrFlow'), nodes=flow.children, centerNode=null;
  for(var n=0;n<nodes.length;n++){
    var el=nodes[n]; if(el.classList.contains('section')) continue;
    var li=+el.dataset.i;
    // owning stamp (the one whose line-set includes this line)
    var owner=null, oi=-1; for(var j=0;j<stamps.length;j++){ if(stampLineSet(stamps[j]).indexOf(li)!==-1){ owner=stamps[j]; oi=j; break; } }
    if(activeStamp && activeIdxs.indexOf(li)!==-1){ paintLine(el,'active'); if(!centerNode) centerNode=el; }
    else if(owner){ var s2=owner.time, l2=(owner.len!=null)?owner.len:((oi+1<stamps.length)?(stamps[oi+1].time-s2):(dur?dur-s2:3)), e2=s2+Math.max(0.05,l2); paintLine(el,(t>=e2)?'past':'future'); }
    else paintLine(el,'future');   // includes unmarked lines (e.g. right after deleting a marker)
  }
  if(lyrManualY!==null && (AEL.paused || Date.now()<lyrBrowseUntil)) return; // user is browsing the lyrics
  flow.classList.remove('nodrift');
  if(centerNode){ var stage=document.getElementById('lyrStage'); flow.style.transform='translateY('+(-(centerNode.offsetTop - stage.clientHeight/2 + centerNode.offsetHeight/2))+'px)'; }
}
// Solo 2 estados visuales: activa = blanco pleno + semibold (destaca cual se esta cantando);
// todo lo demas (previous/next/sin marcar) = 40% opacidad + peso regular, uniforme.
var ACCENT_LYRIC='#fff';
function paintLine(el, state){

  lk.style.color = active ? ACCENT_LYRIC : 'rgba(255,255,255,.22)';
  lk.style.fontWeight = active ? '600' : '400';

function seekToLine(i){

  if(!s){ toast('No timestamp on this line yet'); return; }
  AEL.currentTime=s.time; var vp=1/zoom, gp=s.time/dur; scrollPct=Math.max(0,Math.min(1-vp,gp-vp/2)); lyrManualY=null; frameUpdate();
}
function getTY(el){ var m=/translateY\((-?[\d.]+)px\)/.exec(el.style.transform||''); return m?parseFloat(m[1]):0; }
function clampLyr(y){ var stage=document.getElementById('lyrStage'), fl=document.getElementById('lyrFlow'); var min=-(fl.offsetHeight - stage.clientHeight*0.4), max=stage.clientHeight*0.4; return Math.max(min,Math.min(max,y)); }
function startLyrEase(){ if(lyrEaseId) return; var fl=document.getElementById('lyrFlow'); (function step(){ var cur=clampLyr(getTY(fl)+lyrVel); fl.style.transform='translateY('+cur+'px)'; lyrManualY=cur; lyrVel*=0.8; if(Math.abs(lyrVel)>0.15){ lyrEaseId=requestAnimationFrame(step); } else { lyrVel=0; lyrEaseId=null; } })(); }
function isSection(line){ var s=(line||'').trim(); if(!s) return false; if(/^\[.*\]$/.test(s)) return true; if(/^\(\s*(?:pre-?chorus|post-?chorus|intro|verse|chorus|bridge|outro|hook|refrain|interlude|breakdown|instrumental|solo)(?:\s*\d+)?(?:\s*[:\-]\s*[^)]{0,30})?\s*\)$/i.test(s)) return true; if(/^(intro|verse|chorus|pre-?chorus|post-?chorus|bridge|outro|hook|refrain|interlude|breakdown|instrumental|solo)(\s*\d+)?\s*:?$/i.test(s)) return true; return false; }
function nextStampable(from){ for(var i=Math.max(0,from);i<lines.length;i++) if(!isSection(lines[i])) return i; return lines.length; }
// Strip Genius artifacts ("You might also like" promo, Embed counts, etc.) — they are not part of the lyrics
function isJunkLine(s){ return /^you might also like$/i.test(s) || /^\d+\s*embed$/i.test(s) || /^embed$/i.test(s) || /^see .+ live/i.test(s) || /get tickets as low as/i.test(s) || /^\d+\s*contributors?/i.test(s) || /^translations?$/i.test(s); }
function deriveLines(text){
  var raw=(text||'').split('\n');
  var out=[], skip=false;
  // Skip everything before the first section marker ([Verse], [Chorus], etc.) to strip
  // contributor names and other metadata that Genius places before the actual lyrics.
  var firstSection=-1;
  for(var j=0;j<raw.length;j++){ if(isSection(raw[j].trim())){ firstSection=j; break; } }
  var start=firstSection>=0?firstSection:0;
  for(var i=start;i<raw.length;i++){
    var s=raw[i].trim();
    var idx=s.toLowerCase().indexOf('you might also like');
    if(idx>=0){ var before=s.slice(0,idx).trim(); if(before && !isJunkLine(before)) out.push(before); skip=true; continue; }
    if(skip){ if(isSection(s)){ skip=false; } else continue; }
    if(!s || isJunkLine(s)) continue;
    out.push(s);
  }
  return out;
}

// ─── TIMELINE ─── (markers rebuilt only when dirty/scroll/zoom changes; playhead positioned every frame = smooth)
// Marcadores como PUNTOS (nov 2026). false = pildoras de siempre.
var TL_DOTS=true;
try{ document.body.classList.toggle('tl-dots', TL_DOTS); }catch(e){}
function defaultLen(i){ if(i+1<stamps.length) return Math.max(0.15, stamps[i+1].time-stamps[i].time-0.02); return Math.min(2, Math.max(0.5, dur?dur-stamps[i].time:2)); }
function markerLen(s,i){ return (s.len!=null)? s.len : defaultLen(i); }
function resolveCollisions(idx, spp){
  if(idx<0) return; var GAP=Math.max(0.02, 4*(spp||0));
  var body=function(i){ return stamps[i].len!=null ? stamps[i].len : 0; };   // default-length markers behave as points for collision
  for(var j=idx+1;j<stamps.length;j++){ var need=stamps[j-1].time+body(j-1)+GAP; if(stamps[j].time < need){ stamps[j].time=Math.min(dur,need); } else break; }   // push touching markers right, stop at first gap
  for(var k=idx-1;k>=0;k--){ var max=stamps[k+1].time-GAP-body(k); if(stamps[k].time > max){ stamps[k].time=Math.max(0,max); } else break; }                       // push touching markers left, stop at first gap
}
function getStampById(id){ for(var i=0;i<stamps.length;i++) if(stamps[i].id===id) return stamps[i]; return null; }

function renderMarkers(){
  if(TL_DOTS) return renderMarkersDots();
  var W=tlTrack.clientWidth, mk=document.getElementById('tlMarkers'); mk.innerHTML='';
  _lastScroll=scrollPct; _lastZoom=zoom;
  if(!dur) return;
  var vp=1/zoom;
  stamps.forEach(function(s,i){
    var gp=s.time/dur, len=markerLen(s,i), ge=Math.min(1,(s.time+len)/dur);
    if(ge<scrollPct||gp>scrollPct+vp) return;
    // markers touch by default; the SELECTED one detaches (small gap) so its length is adjustable
    var _selm=selStampSet.has(s.id), _gap=_selm?5:0;
    var x=(gp-scrollPct)/vp*W+_gap/2, w=Math.max(8,(ge-gp)/vp*W-_gap);
    var el=document.createElement('div'); el.className='tl-marker'+(selStampSet.has(s.id)?' sel':''); el.style.left=x+'px'; el.style.width=w+'px'; el.style.background=lineColor(stampLineSet(s).length); el.dataset.sid=s.id; el.title='#'+(i+1)+'  '+fmtClock(s.time);
    el.addEventListener('mousemove', function(ev){ if(mkDrag||scrubbing) return; var r=el.getBoundingClientRect(), ox=ev.clientX-r.left; el.style.cursor=(ox<7||ox>r.width-7)?'ew-resize':'grab'; });
    el.addEventListener('mousedown', function(ev){ if(ev.button!==0) return; ev.stopPropagation(); ev.preventDefault(); startMarkerDrag(ev, s.id, el); });

    // marcador (startMarkerDrag detecta ox<7 / ox>width-7 y cambia el cursor a ew-resize).
    mk.appendChild(el);
  });

// ── Timeline de PUNTOS ──
// Cada marcador es un .tl-marker (zona de clic = todo su tramo) con:
//   .tl-pill = el punto brillante del timestamp; seleccionado se ESTIRA a pildora (anima width)
//   .tl-dot  = puntos opacos de la duracion; seleccionado se desvanecen
// Los elementos se REUSAN por id (no innerHTML) para que la pildora pueda animarse.
// Posicion: el punto brillante va en el tiempo real del timestamp (si queda encimado con el anterior
// se corre hasta un paso, nunca mas); los opacos se reparten parejo hasta el siguiente. Si el marcador esta recortado
// (termina antes que el siguiente), los puntos acaban en su final y queda un hueco vacio.
var _dotEls={};
function renderMarkersDots(){
  var W=tlTrack.clientWidth, mk=document.getElementById('tlMarkers');
  _lastScroll=scrollPct; _lastZoom=zoom;
  if(!dur){ mk.innerHTML=''; _dotEls={}; return; }
  var D=tlTrack.clientHeight||8, G=Math.max(2,Math.round(D*0.32)), P=D+G, vp=1/zoom;
  function X(t){ return (t/dur-scrollPct)/vp*W; }
  var vx=[], prevX=-1e9;
  for(var i=0;i<stamps.length;i++){ var ex=X(stamps[i].time), x=Math.max(ex, Math.min(prevX+P, ex+P)); vx.push(x); prevX=x; }   // corrimiento maximo: 1 paso (si no cabe, se enciman en vez de correrse)
  var seen={};
  for(var j=0;j<stamps.length;j++){
    var s=stamps[j], len=markerLen(s,j), nx=stamps[j+1], x0=vx[j];
    var cut=nx ? (s.time+len < nx.time-0.05) : true;          // recortado (o ultimo): termina en su propio final
    var endX=cut ? X(s.time+len) : vx[j+1]-G;
    if(endX<x0+D) endX=x0+D;
    if(endX<-P || x0>W+P) continue;
    var w=endX-x0, dims=[];
    if(!cut){ var span=vx[j+1]-x0, n=Math.max(1,Math.min(Math.round(span/P),Math.floor(span/(D+1.5)))), pitch=span/n; for(var k=1;k<n;k++) dims.push(k*pitch); }
    else { for(var c=P; c+D<=w+0.5; c+=P) dims.push(c); }
    var el=_dotEls[s.id];
    if(!el){
      el=document.createElement('div'); el.className='tl-marker'; el.dataset.sid=s.id;
      var pl=document.createElement('div'); pl.className='tl-pill'; pl.style.width=D+'px'; el.appendChild(pl);
      (function(el, sid){
        el.addEventListener('mousemove', function(ev){ if(mkDrag||scrubbing) return; if(!el.classList.contains('sel')){ el.style.cursor='pointer'; return; } var r=el.getBoundingClientRect(), ox=ev.clientX-r.left; el.style.cursor=(ox<7||ox>r.width-7)?'ew-resize':'grab'; });
        el.addEventListener('mousedown', function(ev){ if(ev.button!==0) return; ev.stopPropagation(); ev.preventDefault(); startMarkerDrag(ev, sid, el); });
      })(el, s.id);
      _dotEls[s.id]=el;
    }
    if(el.parentNode!==mk) mk.appendChild(el);
    seen[s.id]=1;
    var sel=selStampSet.has(s.id);
    if(sel!==el.classList.contains('sel')){
      el.classList.add('anim'); clearTimeout(el._animT);
      el._animT=setTimeout((function(e){ return function(){ e.classList.remove('anim'); }; })(el), 400);
      el.classList.toggle('sel', sel);
    }
    if(mkDrag && mkDrag.moved && mkDrag.sid===s.id) el.classList.remove('anim');   // arrastrando: sigue al mouse sin retraso
    el.style.left=x0+'px'; el.style.width=w+'px';
    el.title='#'+(j+1)+'  '+fmtClock(s.time);
    el.firstChild.style.width=(sel?w:D)+'px';
    var kids=el.children.length-1;
    while(kids<dims.length){ var dd=document.createElement('i'); dd.className='tl-dot'; dd.style.width=D+'px'; el.appendChild(dd); kids++; }
    while(kids>dims.length){ el.removeChild(el.lastChild); kids--; }
    for(var q=0;q<dims.length;q++){ var de=el.children[q+1]; de.style.left=dims[q]+'px'; de.style.width=D+'px'; }
  }
  for(var id in _dotEls){ if(!seen[id]){ var old=_dotEls[id]; if(old.parentNode) old.parentNode.removeChild(old); delete _dotEls[id]; } }
  for(var ci=mk.children.length-1;ci>=0;ci--){ var ce=mk.children[ci]; if(_dotEls[ce.dataset.sid]!==ce) mk.removeChild(ce); }   // restos del modo pildoras
}

function miniSeek(cx){ var mini=document.getElementById('tlMini'), r=mini.getBoundingClientRect(); if(!r.width) return; var pct=(cx-r.left)/r.width; scrollPct=clampScroll(pct-(1/zoom)/2); scrollTarget=scrollPct; tlRefresh(); }

function clampScroll(s){ return Math.max(0,Math.min(1-1/zoom,s)); }

function startMarkerDrag(ev, sid, el){

function clearActive(){ if(!stamps.length){ toast('No timestamps'); return; } pushUndo(); stamps=[]; curLine=nextStampable(0); pendingId=null; selStampSet.clear(); saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0); toast('Timestamps cleared'); }

// ─── RAF / FRAME ───
function schedRAF(){ if(rafId) return; rafId=requestAnimationFrame(function loop(){ frameUpdate(); if(!AEL.paused) rafId=requestAnimationFrame(loop); else rafId=null; }); }
function frameUpdate(){
  var t=AEL.currentTime||0;
  if(!AEL.paused){
    if(tlEaseId){ cancelAnimationFrame(tlEaseId); tlEaseId=null; } scrollTarget=scrollPct;
    var browsing=Date.now()<lyrBrowseUntil;   // user is scrolling the lyrics to read ahead
    if(!browsing){ if(lyrEaseId){ cancelAnimationFrame(lyrEaseId); lyrEaseId=null; } lyrVel=0; }
    var vp=1/zoom, gp=dur?t/dur:0, mg=vp*0.08; if(gp>scrollPct+vp-mg) scrollPct=Math.min(1-vp,gp-vp+mg); else if(gp<scrollPct+mg&&zoom>1) scrollPct=Math.max(0,gp-mg);
    if(!browsing) lyrManualY=null;
  }
  renderTimeline(t); updateLyricHighlight(t);
}

function openAudio(){ document.getElementById('fin').click(); }
function loadAudio(inp){
  var f=inp.files[0]; if(!f) return; var ch=getActive(); if(!ch){ toast('Open a channel first'); return; }

// Build an SRT string for an arbitrary channel (active one uses the live working set).
function buildSRTFor(ch, lpb){
  lpb=lpb||1;
  var st=(ch.id===activeId)?stamps:(ch.stamps||[]);
  var ln=(ch.id===activeId)?lines:(ch.lines||[]);
  var d =(ch.id===activeId)?dur:(ch.audioDur||0);
  if(!st.length) return '';
  function mlen(s,i){ if(s.len!=null) return s.len; if(i+1<st.length) return Math.max(0.15, st[i+1].time-st[i].time-0.02); return Math.min(2, Math.max(0.5, d?d-st[i].time:2)); }
  var blocks=[];
  for(var i=0;i<st.length;i+=lpb){ var blk=st.slice(i,i+lpb), s0=blk[0].time, li=i+blk.length-1, last=st[li], en=last.time+mlen(last,li); if(d) en=Math.min(en,d); blocks.push({st:s0,en:Math.max(s0+.3,en),txt:blk.map(function(s){ return stampTextOf(s,ln); }).join('\n')}); }
  return blocks.map(function(b,i){ return (i+1)+'\n'+toSRT(b.st)+' --> '+toSRT(b.en)+'\n'+b.txt; }).join('\n\n');
}
// Download a string as a real .srt file (octet-stream → iOS won't append .txt).
function dlText(text, name){

  var blob=new Blob([text],{type:'application/octet-stream'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1500);
}
// Mueve cualquier "(feat. X)" / "ft. X" / "featuring X" del SONG al ARTIST. El Song queda
// limpio sin featuring; el Artist lo lleva.
function _splitFeat(artist, song){
  artist=(artist||'').trim(); song=(song||'').trim(); var who=null, m;
  m=song.match(/[\(\[]\s*(?:feat\.?|ft\.?|featuring)\s+([^)\]]+?)\s*[\)\]]/i);
  if(m){ who=m[1]; song=song.replace(m[0],'').replace(/\s{2,}/g,' ').trim(); }
  else { m=song.match(/\s+(?:feat\.?|ft\.?|featuring)\s+(.+)$/i); if(m){ who=m[1]; song=song.slice(0,m.index).trim(); } }
  if(who){
    who=who.replace(/^\s+|\s+$/g,'').replace(/[\(\)\[\]]/g,'').trim();
    var baseA=artist.replace(/\s*(?:feat\.?|ft\.?|featuring)\s+.*$/i,'').trim();
    artist = baseA ? (baseA+' feat. '+who) : ('feat. '+who);
  }
  return {artist:artist, song:song};
}
// Verso (un solo canal): sin numeracion — "Artist - Song" (sin ft/feat en el Song, que se
// mueve al Artist). A diferencia de LMG/CM, aqui NO hay prefijo "NN " porque el target es
// unico (una sola comp de cada cosa), no hace falta nomenclatura para que AE lo ubique.
function _srtName(ch){
  var r=_splitFeat(ch.artist||'', ch.song||''), a=r.artist, s=r.song;
  return (a&&s) ? (a+' - '+s) : (s||a||ch.name||'subtitles');
}

function _readResultFile(cb){

// Llama a una funcion del host que ABRE UN DIALOGO. CEP pierde el valor de retorno en
// ese caso, asi que si llega vacio se recupera del volcado temporal con una 2a llamada
// corta (sin dialogo), que si retorna. cb(null) solo si de verdad no hubo nada.
// El host EMPUJA su resultado con CSXSEvent (mecanismo estandar de CEP). Es fiable
// aunque evalScript pierda el valor de retorno por culpa del dialogo modal.
var _dlgPending=null;
function _initHostEvents(){
  if(!csInterface || _initHostEvents.done) return;
  _initHostEvents.done=true;
  try{
    csInterface.addEventListener('com.leobledo.verso.result', function(ev){
      var data = ev && (ev.data!=null ? ev.data : (ev.detail||null));
      if(_dlgPending && data){ var f=_dlgPending; _dlgPending=null; f(String(data)); }
    });
  }catch(e){}
}
function _evalDlg(script, cb){
  if(!csInterface){ cb(null); return; }
  _initHostEvents();
  try{ startProgress(9000); }catch(e){}   // barra de progreso para todo proceso largo
  var done=false, tries=0, timer=null;
  function finish(v){ if(done) return; done=true; _dlgPending=null; if(timer) clearInterval(timer); try{ stopProgress(); }catch(e){} try{ reclaimFocus(); }catch(e){} cb(v); }   // tras importar (dialogo de AE) devolvemos el foco al panel
  _dlgPending=finish;                       // 1) via evento (la fiable)
  csInterface.evalScript(script, function(raw){ if(raw) finish(raw); });   // 2) retorno directo
  // 3) respaldo: sondeo por temporizador del volcado temporal. Independiente de los
  //    callbacks, que AE se traga mientras esta bloqueado por el dialogo.
  timer=setInterval(function(){
    if(done) return;
    if(++tries>150){ finish(null); return; }   // ~60s de margen
    try{ csInterface.evalScript('_readResultText()', function(t){ if(t) finish(t); }); }catch(e){}
  }, 400);
}

// ─── STAMP ───
function doStamp(){
  collapseDotsSel();
  var ach=getActive(); if(!ach||!ach.audioURL){ toast('Load audio for this channel first'); return; }
  if(!lines.length){ toast('Add lyrics first'); return; }
  lyrBrowseUntil=0; lyrManualY=null;   // stamping snaps the lyrics back to the current line
  // When timestamping starts, collapse the expanded channel container for more room.
  if(expandedId!==null){ expandedId=null; setExpanded(-1); }
  // Each ENTER stamps the current line and moves to the next (v2 behaviour). Marker length is adjusted manually by resizing.
  curLine=nextStampable(curLine);
  if(curLine>=lines.length){
    // No more lines: one last ENTER closes the last marker at the current time.
    if(stamps.length){
      var last=stamps[stamps.length-1], end=AEL.currentTime;
      if(end>last.time+0.05){ pushUndo(); last.len=end-last.time; saveWorkingSet(); tlRefresh(); toast('last marker closed at '+fmtClock(end)); return; }
    }
    toast('All lines stamped'); return;
  }
  pushUndo();
  var grp=stampGroupFrom(curLine);   // up to linesPerStamp stampable lines
  if(!grp.length){ toast('All lines stamped'); return; }
  stamps.push({id:++stampSeq,lineIdx:grp[0],idxs:grp,time:AEL.currentTime}); stamps.sort(function(a,b){ return a.time-b.time; });
  curLine=nextStampable(grp[grp.length-1]+1);
  saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0);
  // Sin leyenda por marcador: la hora al colocar no es relevante y ensuciaba la barra.
}

// ─── UNDO / REDO ───
function pushUndo(){ undoStack.push({stamps:JSON.parse(JSON.stringify(stamps)),curLine:curLine}); if(undoStack.length>80) undoStack.shift(); redoStack=[]; }
function undoAction(){ if(!undoStack.length){ toast('Nothing to undo'); return; } redoStack.push({stamps:JSON.parse(JSON.stringify(stamps)),curLine:curLine}); var s=undoStack.pop(); stamps=s.stamps; curLine=s.curLine; saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0); toast('Undo'); }
function redoAction(){ if(!redoStack.length){ toast('Nothing to redo'); return; } undoStack.push({stamps:JSON.parse(JSON.stringify(stamps)),curLine:curLine}); var s=redoStack.pop(); stamps=s.stamps; curLine=s.curLine; saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0); toast('Redo'); }

// ─── KEYBOARD ───
function onKey(e){
  var tg=document.activeElement.tagName; if(tg==='TEXTAREA'||tg==='INPUT'||tg==='SELECT') return;
  // stop() evita que la tecla llegue a AE (en Mac CMD+Z disparaba el undo del proyecto y
  // sacaba el foco a la timeline principal). registerKeyEventsInterest hace lo mismo a
  // nivel CEP; esto lo refuerza en el lado del panel.
  function stop(){ e.preventDefault(); if(e.stopPropagation) e.stopPropagation(); }
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){ stop(); if(e.shiftKey) redoAction(); else undoAction(); return; }
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyY'){ stop(); redoAction(); return; }   // CMD/CTRL+Y = redo
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.code==='KeyV'){ stop(); pasteSection(); return; }   // CMD/CTRL+V = pegar seccion copiada
  if(e.code==='Space'){ stop(); togglePlay(); return; }
  if(e.code==='Enter'||e.code==='NumpadEnter'){ stop(); doStamp(); return; }
  // 1/2/3/4 = lineas por timestamp (solo sin modificadores: Shift/Cmd/Ctrl/Alt+numero no se tocan)
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey){
    var dg=/^(?:Digit|Numpad)([1-4])$/.exec(e.code||'');
    var nk=dg?+dg[1]:(/^[1-4]$/.test(e.key||'')?+e.key:0);
    if(nk){ stop(); if(!e.repeat) applyLinesPerStamp(nk); return; }
  }
  if((e.code==='Delete'||e.code==='Backspace') && selStampSet.size){ stop(); pushUndo(); stamps=stamps.filter(function(s){ return !selStampSet.has(s.id); }); selStampSet.clear(); recomputeCurLine(); saveWorkingSet(); updTimed(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0); toast('Marker(s) deleted'); }
}
// CEP: reclamar estas combinaciones para que AE NO las procese (que no reproduzca su comp con
// Space, no dispare el undo del proyecto con Cmd+Z, etc.) y las reciba el panel.
// CLAVE: registerKeyEventsInterest usa el keyCode de JavaScript (Space=32, Enter=13, Z=90...),
// el MISMO en Windows y Mac. El bug era usar en Mac los virtuales de macOS (Space=49): AE nunca
// soltaba Space y reproducia su composicion. Ahora Mac usa 32 igual que Windows.
function _registerKeys(){
  try{
    if(!csInterface || !csInterface.registerKeyEventsInterest){
      if(IS_MAC && !_registerKeys._warned){ _registerKeys._warned=1; toast('⚠ registerKeyEventsInterest no disponible en este CEP — avisa a soporte', 6000); }
      return;
    }
    var ev;
    if(IS_MAC){
      // MAC: formato minimo (solo el modificador que aplica) para combos SIN modificador
      // (ya confirmado funcionando para Play). Para combos CON modificador (undo/redo) se usa
      // el formato explicito de 4 banderas (K2, igual que Windows), reforzado con respaldos de
      // virtual keycode de macOS por si esta build de CEP los matchea asi.
      ev=[];
      function m(code, mods){ var o={keyCode:code}; if(mods) for(var k in mods) o[k]=mods[k]; ev.push(o); }
      // NO TOCAR: formato ya confirmado funcionando para Play en Mac.
      m(32);                                            // Space (play)
      m(13);                                            // Enter / NumpadEnter (stamp) — ambos son keyCode 13
      m(8); m(46);                                      // Backspace / Delete (borrar)
      function K2(code, ctrl, meta, shift){ return { keyCode:code, ctrlKey:!!ctrl, altKey:false, shiftKey:!!shift, metaKey:!!meta }; }
      ev.push(K2(90,false,true,false), K2(90,false,true,true));   // Cmd+Z / Cmd+Shift+Z (undo/redo)
      ev.push(K2(90,true,false,false), K2(90,true,false,true));   // Ctrl+Z / Ctrl+Shift+Z
      ev.push(K2(89,false,true,false), K2(89,true,false,false));  // Cmd/Ctrl+Y (redo)
      ev.push(K2(86,false,true,false), K2(86,true,false,false));  // Cmd/Ctrl+V (pegar seccion)
      m(86,{metaKey:true}); m(86,{ctrlKey:true}); m(9,{metaKey:true}); m(9,{ctrlKey:true});   // respaldo: V = 9 en macOS
      // Respaldo: mismos combos con los virtual keycodes de macOS (Z=6, Y=16)
      m(90,{metaKey:true}); m(90,{metaKey:true,shiftKey:true});
      m(90,{ctrlKey:true}); m(90,{ctrlKey:true,shiftKey:true});
      m(89,{metaKey:true}); m(89,{ctrlKey:true});
      m(6,{metaKey:true}); m(6,{metaKey:true,shiftKey:true}); m(6,{ctrlKey:true}); m(6,{ctrlKey:true,shiftKey:true});
      m(16,{metaKey:true}); m(16,{ctrlKey:true});
      // Respaldo generico: virtual keycodes de macOS para Enter/Delete
      m(49); m(36); m(76); m(51); m(117);
      // 1-4 (lineas por timestamp): fila de numeros (49-52) y teclado numerico (97-100), keyCode JS
      m(49); m(50); m(51); m(52); m(97); m(98); m(99); m(100);
    } else {
      // WINDOWS: formato que ya funciona perfecto — NO cambiar.
      function K(code, ctrl, meta, shift){ return { keyCode:code, ctrlKey:!!ctrl, altKey:false, shiftKey:!!shift, metaKey:!!meta }; }
      ev=[
        K(90,true,false,false), K(90,false,true,false),   // Ctrl+Z / Cmd+Z  (undo)
        K(90,true,false,true),  K(90,false,true,true),    // +Shift          (redo)
        K(89,true,false,false), K(89,false,true,false),   // Ctrl/Cmd+Y      (redo)
        K(86,true,false,false), K(86,false,true,false),   // Ctrl/Cmd+V      (pegar seccion)
        K(32,false,false,false),                          // Space           (play)
        K(13,false,false,false),                          // Enter           (stamp)
        K(8,false,false,false), K(46,false,false,false),  // Backspace / Del (borrar)
        K(49,false,false,false), K(50,false,false,false), K(51,false,false,false), K(52,false,false,false),   // 1-4 (lineas)
        K(97,false,false,false), K(98,false,false,false), K(99,false,false,false), K(100,false,false,false)  // Numpad 1-4
      ];
    }
    var _r=csInterface.registerKeyEventsInterest(JSON.stringify(ev));
    // Diagnostico (una vez): confirma en vivo si el registro se ejecuto sin lanzar. No
    // garantiza que AE lo honre, pero descarta que el bridge nativo este ausente o fallando.
    if(IS_MAC && !_registerKeys._ok){ _registerKeys._ok=1; toast('Verso: teclas registradas ('+ev.length+')', 2500); }
  }catch(e){
    if(IS_MAC && !_registerKeys._err){ _registerKeys._err=1; toast('⚠ Verso: fallo registrando teclas — '+(e&&e.message||e), 6000); }
  }
}

// ─── GLOBAL MOUSE ───
function onGlobalMove(e){
  if(hDrag){ var dx=e.clientX-hStartX, w=Math.max(220,Math.min(hStartW+dx, document.getElementById('workspace').offsetWidth*0.6)); document.getElementById('songsPanel').style.width=w+'px'; tlRefresh(); return; }
  if(vDrag){ var dy=vStartY-e.clientY, h=Math.max(80,Math.min(vStartH+dy, window.innerHeight*0.5)); document.getElementById('timelineZone').style.height=h+'px'; tlRefresh(); return; }
  if(tlPanning){ var pr=tlTrack.getBoundingClientRect(); if(pr.width){ var pdx=e.clientX-tlPanStartX; scrollPct=clampScroll(tlPanStartScroll - pdx/pr.width/zoom); scrollTarget=scrollPct; tlRefresh(); } return; }
  if(miniDragging){ miniSeek(e.clientX); return; }
  if(scrubbing){ doScrub(e.clientX+_scrubOff); return; }
  if(mkDrag){
    var ddx=e.clientX-mkDrag.startX; if(Math.abs(ddx)>2) mkDrag.moved=true;
    if(mkDrag.mode==='none'){ mkDrag.moved=false; return; }
    if(mkDrag.moved&&!mkDrag.pushed){ pushUndo(); mkDrag.pushed=true; }
    var s=getStampById(mkDrag.sid); if(!s||!mkDrag.W) return;
    var secPerPx=(dur/zoom)/mkDrag.W, di=stamps.indexOf(s), GAP=Math.max(0.02,4*secPerPx);
    if(mkDrag.mode==='move'){
      var desired=Math.max(0,Math.min(dur,mkDrag.t0+ddx*secPerPx));
      if(mkDrag.touch){
        s.time=desired; showTip(s.time,e.clientX);
      } else {
        var bodyS=(s.len!=null?s.len:0);
        var prev=stamps[di-1], next=stamps[di+1];
        var lo=prev?(prev.time+(prev.len!=null?prev.len:0)+GAP):0, hi=next?(next.time-GAP-bodyS):dur; if(hi<lo) hi=lo;
        s.time=Math.max(lo,Math.min(hi,desired)); showTip(s.time,e.clientX);
      }
    }
    else if(mkDrag.mode==='r'){
      // right edge: clamp against the NEXT marker (leave a gap) — never push it.
      var nR=stamps[di+1];
      var maxLen=(nR?(nR.time-GAP):dur)-s.time;
      s.len=Math.max(0.1, Math.min(mkDrag.len0+ddx*secPerPx, Math.max(0.1,maxLen)));
      showTip(s.time+s.len,e.clientX);
    }
    else {
      // left edge: move start, keep the right edge fixed; clamp against the PREV marker.
      var pL=stamps[di-1];
      var minT=pL?(pL.time+(pL.len!=null?pL.len:0)+GAP):0;
      var rightEdge=mkDrag.t0+mkDrag.len0;
      var nt=Math.max(minT, Math.min(rightEdge-0.1, mkDrag.t0+ddx*secPerPx));
      s.time=nt; s.len=Math.max(0.1, rightEdge-nt); showTip(s.time,e.clientX);
    }
    tlRefresh(); return;
  }
  if(lyrDrag){ var dy2=e.clientY-lyrDragStartY; if(Math.abs(dy2)>3) lyrMoved=true; var fl=document.getElementById('lyrFlow'); fl.style.transform='translateY('+(lyrBaseY+dy2)+'px)'; lyrManualY=lyrBaseY+dy2; return; }
}
function onGlobalUp(){
  if(hDrag){ hDrag=false; document.getElementById('rszH').classList.remove('drag'); }
  if(vDrag){ vDrag=false; document.getElementById('rszV').classList.remove('drag'); }
  if(scrubbing){ scrubbing=false; }
  if(tlPanning){ tlPanning=false; }
  if(miniDragging){ miniDragging=false; }
  if(mkDrag){
    if(!mkDrag.moved){ if(mkDrag.ctrl){ if(selStampSet.has(mkDrag.sid)) selStampSet.delete(mkDrag.sid); else selStampSet.add(mkDrag.sid); } else { selStampSet.clear(); selStampSet.add(mkDrag.sid); } }
    else { stamps.sort(function(a,b){ return a.time-b.time; }); saveWorkingSet(); updTimed(); if(TL_DOTS && !IS_TOUCH) selStampSet.clear(); }   // puntos: ajustado -> vuelve a puntos
    hideTip(); mkDrag=null; tlRefresh(); updateLyricHighlight(AEL.currentTime||0);
    if(IS_TOUCH) syncTouchButtons();
  }
  if(lyrDrag){ lyrDrag=false; document.getElementById('lyrStage').classList.remove('grabbing'); }
}

// ─── EXPORT / IMPORT ───
// Builds the SRT string from the current stamps. lpb = lines per block.
// Text of a stamp = its covered lines joined (Verso 2: up to 3 lines per timestamp).
function stampTextOf(s, ln){ ln=ln||lines; if(s.idxs&&s.idxs.length) return s.idxs.map(function(i){ return ln[i]||''; }).join('\n'); return ln[s.lineIdx]||''; }
function buildSRT(lpb){
  lpb=lpb||1; var blocks=[];
  for(var i=0;i<stamps.length;i+=lpb){ var blk=stamps.slice(i,i+lpb), st=blk[0].time, li=i+blk.length-1, last=stamps[li], en=last.time+markerLen(last,li); if(dur) en=Math.min(en,dur); blocks.push({st:st,en:Math.max(st+.3,en),txt:blk.map(function(s){ return stampTextOf(s,lines); }).join('\n')}); }
  return blocks.map(function(b,i){ return (i+1)+'\n'+toSRT(b.st)+' --> '+toSRT(b.en)+'\n'+b.txt; }).join('\n\n');
}
