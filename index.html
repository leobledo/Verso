// Channels whose import auto-creates the AE comp (named like the channel) when no comp is selected.
function chAutoCreatesComp(name){ return (name||'').trim().toLowerCase()==='nightclub nostalgia'; }

// Import lyrics into After Effects using the "Style Controler" layer:
//   - Target comp = the comp selected/active in the AE Project panel.
//   - If none is selected and the channel auto-creates (Nightclub Nostalgia),
//     a comp named like the channel is found or created.
//   - Each line is a duplicate of the "Style Controler" layer (inherited style +
//     box text), centered, with an opacity fade in/out expression.
function importStyleController(){
  if(!csInterface){ toast('Not running inside After Effects'); return; }
  if(!stamps.length){ toast('No timestamps yet'); return; }
  var lpbEl=document.getElementById('lpb'), lpb=lpbEl?(parseInt(lpbEl.value)||1):1;
  var srt=buildSRT(lpb); if(!srt.trim()){ toast('Nothing to import'); return; }
  var ch=getActive(), chName=(ch&&ch.name)?ch.name.trim():'';
  var opt={
    compName:chName,
    autoCreate:chAutoCreatesComp(chName),
    styleLayerName:'Style Controler',
    fadeIn:0.3, fadeOut:0.3,
    center:true, extend:true,
    // Verso single-channel: target the comp containing "Lyrics" automatically.
    lyricsBySuffix:true,
    compWidth:1920, compHeight:1080, compFps:30, compDuration:60
  };
  toast('Importing to comp…');
  csInterface.evalScript('importViaStyleController('+JSON.stringify(_srtSafe(srt))+','+JSON.stringify(JSON.stringify(opt))+')', function(result){
    if(!result||result==='undefined'){ toast('No response from AE — check Script Debug Console'); return; }
    if(result.indexOf('ok:')===0){ toast('✓ '+result.slice(3)); }
    else { var msg=result.indexOf('err:')===0?result.slice(4):result; toast('AE error: '+msg); }
  });
}

// Pull the channel's Song audio from the project into the timeline.
// Self-contained ExtendScript (does NOT depend on host.jsx being loaded): it finds the
// "… Song" footage by exact name (else by leading number among audio footage) and returns
// the on-disk path of whatever file is currently loaded there.
// verbose=true → toast the reason if it can't be found (used on channel click / play).
// Self-contained ExtendScript that finds the channel's "… Song" footage (by name, else
// by leading number) and returns "OK:<current file path>" or "ERR:…". No host needed.
function _songReadJsx(ch){
  // Nov 2026: primero la "Song" de VIDEO (siempre existe y es la que se reemplaza en todos los
  // casos); si el proyecto no la tiene y estamos en Short, la "Short Song".
  var want=(ch.songName||'song').toLowerCase();
  return '(function(){try{'+
    'var list=[];'+
    'function ok(nm,sh){nm=nm.toLowerCase();if(nm.indexOf("song")===-1)return false;return sh?(nm.indexOf("short")!==-1):(nm.indexOf("short")===-1);}'+
    'function find(w,sh){var i,it;for(i=1;i<=app.project.numItems;i++){it=app.project.item(i);'+
      'if(it instanceof FootageItem&&it.name.replace(/^\\s+|\\s+$/g,"").toLowerCase()===w)return it;}'+
      'for(i=1;i<=app.project.numItems;i++){it=app.project.item(i);if(it instanceof FootageItem&&ok(it.name,sh))return it;}'+
      'return null;}'+
    'for(var k=1;k<=app.project.numItems;k++){var ft=app.project.item(k);if(ft instanceof FootageItem&&ft.hasAudio)list.push(ft.name);}'+
    'var found=find('+JSON.stringify(want)+',false);'+
    (SHORT_MODE?'if(!found)found=find("short song",true);':'')+
    'if(!found)return "ERR:Audio not found. Available: "+(list.join(" | ")||"(none)");'+
    'var f=null;try{f=found.file;}catch(e){}if(!f){try{f=found.mainSource.file;}catch(e){}}'+
    'if(!f)return "ERR:\\""+found.name+"\\" has no file on disk (load it with Master)";'+
    'return "OK:"+f.fsName;'+
  '}catch(e){return "ERR:"+e.toString();}})()';
}
// Apply a channel's loaded-song title (from the file name). overwrite=true replaces it.
// Construye una URL file:// valida en Windows y macOS. Las rutas de Mac suelen llevar
// espacios y acentos: sin escapar, el <audio> no carga y el play no hacia nada.
// Deja el SRT ASCII-safe ANTES de cruzar el puente de CEP: con caracteres no-ASCII
// evalScript puede devolver vacio y el panel mostraba "No response". Tambien evita
// que AE sustituya la fuente en esos glifos.
function _srtSafe(s){
  return String(s==null?"":s)
    .replace(/[\u2018\u2019\u201A\u201B\u02BC\u2032]/g, "'")
    .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
    .replace(/[\u2010\u2011\u2012\u2013\u2014\u2015]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/[\u00A0\u2007\u2009\u200A\u202F]/g, ' ')
    .replace(/[\u200B\u200C\u200D\u200E\u200F\uFEFF]/g, '');
}
function _fileURL(p){
  var cp=String(p||'').replace(/\\/g,'/');
  if(cp.charAt(0)!=='/') cp='/'+cp;            // Windows: /C:/... ; Mac ya empieza con /
  var enc=cp; try{ enc=encodeURI(cp); }catch(e){}
  return 'file://'+enc.replace(/#/g,'%23').replace(/\?/g,'%3F');
}
function _applySongTitle(ch, path, overwrite){
  _lastSongPath=path;   // keep the auto-sync sentinel aligned so the poller won't redo this
  ch.audioURL=_fileURL(path); ch.audioName=ch.songName||'';
  var base=path.split(/[\\\/]/).pop(), meta=parseAudioMeta(base), changed=false;
  var curA=chArtist(ch), curS=chSong(ch);
  if(meta.artist && (overwrite || !(curA&&curA.trim()))){ setChArtist(ch,meta.artist); changed=true; }
  if(meta.song   && (overwrite || !(curS&&curS.trim()))){ setChSong(ch,meta.song);     changed=true; }
  // Verso single-channel: the channel/container name IS the video song title (not Short).
  if(typeof SINGLE_CHANNEL!=='undefined' && SINGLE_CHANNEL && ch.song && ch.song.trim()){
    ch.name=ch.song.trim();
    var rowN=document.querySelector('.channel[data-id="'+ch.id+'"] .ch-name');
    if(rowN) rowN.textContent=ch.name;
  }
  if(changed){
    var na=chArtist(ch), ns=chSong(ch);
    var host=document.getElementById('detailsPanel');
    if(host){ var ins=host.querySelectorAll('.dp-in');
      if(ins[0]){ ins[0].value=na; ins[0].classList.toggle('filled',!!(na&&na.trim())); }
      if(ins[1]){ ins[1].value=ns; ins[1].classList.toggle('filled',!!(ns&&ns.trim())); }
    }
    updateSub(ch.id); updDim(ch.id); if(ch.id===activeId) syncTitle();
  }
  return changed;
}
function aeLoadSong(ch, verbose, overwrite){
  if(!csInterface||!ch) return;
  if(ch.audioURL && !overwrite){ if(ch.id===activeId && AEL.getAttribute('src')!==ch.audioURL){ AEL.src=ch.audioURL; AEL.load(); } return; }
  if(overwrite) ch.audioURL=null;
  csInterface.evalScript(_songReadJsx(ch), function(raw){
    if(!raw){ if(verbose) toast('Audio: no response from AE',6000); return; }
    if(raw.indexOf('OK:')===0){ _applySongTitle(ch, raw.slice(3), overwrite); if(ch.id===activeId){ AEL.src=ch.audioURL; AEL.load(); } }
    else if(verbose){ toast('Audio: '+(raw.indexOf('ERR:')===0?raw.slice(4):raw),7000); }
  });
}
// Refresh titles button in control bar — spins icon while working.
function masterRefreshClick(){
  var btn=document.getElementById('btnLyrRefresh'); if(btn) btn.classList.add('spinning');
  refreshAllTitles(function(){ if(btn) btn.classList.remove('spinning'); });
}
// MASTER refresh: re-read EVERY channel's song and overwrite its title. Verbose summary.
function refreshAllTitles(doneCb){
  if(!IN_AE){
    var c=0; channels.forEach(function(ch){ if(ch.audioName){ var m=parseAudioMeta(ch.audioName); if(m.artist) ch.artist=m.artist; if(m.song){ ch.song=m.song; c++; } } });
    loadChannelAudio(); renderChannels(); syncTitle(); toast('Titles refreshed: '+c);
    if(doneCb) doneCb(); return;
  }
  toast('Refreshing titles…');
  var total=channels.length, done=0, changed=0, lastErr='';
  channels.forEach(function(ch){
    if(ch.songName==null && ch.num==null){ done++; if(done>=total) finish(); return; }
    csInterface.evalScript(_songReadJsx(ch), function(raw){
      done++;
      if(raw && raw.indexOf('OK:')===0){ if(_applySongTitle(ch, raw.slice(3), true)) changed++; }
      else if(raw && raw.indexOf('ERR:')===0){ lastErr=raw.slice(4); }
      if(done>=total) finish();
    });
  });
  function finish(){ renderChannels(); syncTitle(); toast('✓ Titles updated: '+changed+'/'+total+(changed===0&&lastErr?(' · '+lastErr):''), 6000); if(doneCb) doneCb(); }
}

// ─── MASTER / RENDER (from Range Manager) ───
// On web/touch the ♪ button just loads an audio file; Master is AE-only.
function masterAction(ev){
  if(ev) ev.stopPropagation();
  if(!csInterface){ openAudio(); return; }
  toast('Master…');
  ensureHost(function(ok){
    if(!ok){ toast('Could not connect to the AE host'); return; }
    _evalDlg('masterRun()', function(txt){
      _masterDone(txt);
      function _masterDone(txt){
      var r=_parseRes(txt, 'Master'); if(!r) return;
      if(!r.ok){ toast('Master: '+(r.msg||r.step||'error')); return; }
      toast('✓ Audio '+r.replaced+'/'+r.total+' · Lyrics '+r.lyricsCleaned+'/'+r.lyricsTotal+' · Ranges '+r.rangeUpdated+'/'+r.rangeTotal);
      // Clear all SRT layers (separate call so it never risks breaking the song replacement).
      csInterface.evalScript('clearAllLyricLayers(false)', function(){});   // solo VIDEO: la Short conserva su SRT
      // Apply new song paths returned directly by masterRun (no second evalScript round-trip needed).
      if(r.songs && r.songs.length){
        var applied=0;
        r.songs.forEach(function(s){
          if(!s.path) return;
          var sname=(s.name||'').toLowerCase().replace(/\s+/g,'');
          for(var ci=0;ci<channels.length;ci++){
            var ch=channels[ci];
            if(!ch.songName) continue;
            if(ch.songName.toLowerCase().replace(/\s+/g,'')===sname){ _applySongTitle(ch,s.path,true); applied++; break; }
          }
        });
        if(applied>0){ renderChannels(); syncTitle(); loadChannelAudio(); }
        else { aeRefreshAfterMaster(); } // name match failed — fall back to re-reading from AE
      } else {
        aeRefreshAfterMaster(); // fallback if songs array not in response
      }
      }   // fin _masterDone
    });
  });
}
// After Master replaces the songs, re-pull each channel's new audio and overwrite the
// Artist/Song titles in the song containers from the new file names.
function aeRefreshAfterMaster(){ refreshAllTitles(function(){ loadChannelAudio(); }); }

// ─── AE: THUMBNAIL (update the channel's "… TH" comp Artist/Song text + preview) ───
function thumbnailAction(id){
  if(!csInterface){ toast('Only inside After Effects'); return; }
  var ch=id!=null?getChannel(id):getActive();
  if(!ch||!ch.th){ toast('Channel has no TH comp'); return; }
  toast('Updating thumbnail…');
  ensureHost(function(ok){
    if(!ok){ toast('Could not connect to the AE host'); return; }
    // "2 por 1": desde Short se actualizan AMBAS — la TH de video (con los datos de video) Y
    // la comp "Short" (con los datos de short). Desde Video, solo la TH.
    var call=SHORT_MODE
      ? 'updateThumbnailBoth('+JSON.stringify(ch.th)+','+JSON.stringify(ch.artist||chArtist(ch))+','+JSON.stringify(ch.song||chSong(ch))+','+JSON.stringify(chArtist(ch))+','+JSON.stringify(chSong(ch))+')'
      : 'updateThumbnailComp('+JSON.stringify(ch.th)+','+JSON.stringify(chArtist(ch))+','+JSON.stringify(chSong(ch))+')';
    csInterface.evalScript(call, function(r){
      if(r&&r.indexOf('ok:')===0){ toast('✓ Miniatura actualizada · '+r.slice(3), 5000); loadThumbPreview(ch); }
      else { toast('Miniatura: '+(r&&r.indexOf('err:')===0?r.slice(4):(r||'sin respuesta de AE')), 7000); }
    });
  });

// Render a PNG preview of the channel's TH comp (or the "Short" comp) under the lyrics box.
function loadThumbPreview(ch){
  if(!csInterface) return;
  var calls=[];
  if(ch&&ch.th) calls.push('getThumbnailPreviewComp('+JSON.stringify(ch.th)+')');   // TH de video primero
  if(SHORT_MODE) calls.push('getShortThumbnailPreview()');                           // si no hay, la Short
  if(!calls.length) return;
  ensureHost(function(ok){
    if(!ok) return;
    (function next(i){
      if(i>=calls.length) return;
      csInterface.evalScript(calls[i], function(raw){
        var r=null; try{ r=JSON.parse(raw); }catch(e){}
        if(!r||!r.ok||!r.path){ next(i+1); return; }
        var img=ch&&ch._thumbImg; if(!img) return;
        img.src=_fileURL(r.path);   // unique filename per render → no cache-bust needed
        img.style.display='block';
      });
    })(0);
  });
}

  if(ev) ev.stopPropagation();

// Import lyrics into the channel's "… Lyrics" comp (targeted by exact comp name).
function importToChannel(){
  if(!csInterface){ toast('Only inside After Effects'); return; }

    if(!ok){ toast('Could not connect to the AE host'); return; }

      : 'importLyricsToComp('+JSON.stringify(ch.lyr)+','+JSON.stringify(_srtSafe(srt))+','+JSON.stringify(JSON.stringify(opt))+')';

// Clear: wipe the channel (inputs, lyrics, timestamps) and delete its "SRT" layers (AE).
function clearChannelFull(id){
  var ch=id!=null?getChannel(id):getActive(); if(!ch) return;
  if(ch.id!==activeId) selectChannel(ch.id);
  pushUndo();
  // Clear only timestamps + the lyrics input. Keep Artist and Song.
  stamps=[]; lines=[]; curLine=0; pendingId=null; selStampSet.clear();
  ch.lyricsText=''; ch.lines=[]; ch.stamps=[]; ch.curLine=0; ch.loaded=false;
  saveWorkingSet(); renderChannels(); renderLyricsFlow(); syncTitle(); tlRefresh(); updateLyricHighlight(AEL.currentTime||0);
  if(csInterface && ch.lyr){
    ensureHost(function(ok){
      if(!ok){ toast('Channel cleared (no AE connection to remove layers)'); return; }
      csInterface.evalScript('clearLyricLayers('+JSON.stringify(ch.lyr)+')', function(raw){
        var tot=(raw&&raw.indexOf('ok:')===0)?(parseInt(raw.slice(3),10)||0):null;
        function done(){ if(tot!=null){ toast('Channel cleared'+(tot?' · '+tot+' SRT layers removed':'')); } else { toast('Channel cleared (layers: '+(raw||'?')+')'); } }
        if(!SHORT_MODE){ done(); return; }

// embed.js = document.write(JSON.parse('<HTML del embed como literal JS>')) → {lyr, canon}
function _gUnescapeJS(s){

    if(c.length>1) return String.fromCharCode(parseInt(c.slice(1),16));
    return c==='n'?'\n':c==='r'?'\r':c==='t'?'\t':c==='b'?'\b':c==='f'?'\f':c==='v'?'\v':c==='0'?'\0':(c==='\n'||c==='\r')?'':c;

// AE: descarga la pagina con el curl del SISTEMA (via host.jsx) — TLS real + UA de navegador,
// inmune a CORS/Cloudflare del CEF. UNA descarga a la vez y cada una a SU archivo temporal:

  if(!job) return;

// host.jsx con fetchGeniusToFile cargado? Se verifica con un typeof barato (antes se recargaba

function _gCurlHostReady(cb){

    if(has==='1'){ _gCurlHostAt=Date.now(); cb(true); return; }

// Ultimo recurso (web + AE): LRCLIB (API abierta con CORS) buscando "artista titulo" del slug.
// Solo acepta un resultado cuyo artista+titulo cubra el slug (>=75% de sus palabras):

  for(i=0;i<ex.length;i++){ if(ex[i].parentNode) ex[i].parentNode.removeChild(ex[i]); }

  for(i=0;i<brs.length;i++){ if(brs[i].parentNode) brs[i].parentNode.replaceChild(doc.createTextNode('\n'), brs[i]); }
  return clone.textContent||'';
}
// Marcas de agua de Genius en la letra de la pagina: letras cirilicas/griegas identicas a
// las latinas ("е" U+0435 en vez de "e") y espacios raros (U+2005, U+205F…). En AE salen
// con otra fuente o como glifo faltante → se pasan a sus equivalentes normales. Solo en
// palabras que YA tienen letras latinas: una letra realmente en ruso/griego no se toca.
var _G_HOMO={'\u0430':'a','\u0435':'e','\u043E':'o','\u0440':'p','\u0441':'c','\u0443':'y','\u0445':'x','\u0456':'i','\u0458':'j','\u0455':'s','\u0501':'d','\u051B':'q','\u051D':'w','\u04BB':'h','\u04CF':'l',
  '\u0410':'A','\u0412':'B','\u0415':'E','\u041A':'K','\u041C':'M','\u041D':'H','\u041E':'O','\u0420':'P','\u0421':'C','\u0422':'T','\u0425':'X','\u0423':'Y','\u0406':'I','\u0408':'J','\u0405':'S','\u051A':'Q','\u051C':'W',
  '\u03BF':'o','\u03BD':'v','\u03C1':'p','\u0391':'A','\u0392':'B','\u0395':'E','\u0396':'Z','\u0397':'H','\u0399':'I','\u039A':'K','\u039C':'M','\u039D':'N','\u039F':'O','\u03A1':'P','\u03A4':'T','\u03A5':'Y','\u03A7':'X'};
function _gTidy(t){
  return String(t||'')
    .replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g,' ')
    .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
    .replace(/[^\s]+/g, function(w){
      if(!/[\u0370-\u03FF\u0400-\u04FF\u0500-\u052F]/.test(w) || !/[A-Za-z\u00C0-\u024F]/.test(w)) return w;
      return w.replace(/[\u0370-\u03FF\u0400-\u04FF\u0500-\u052F]/g, function(c){ return _G_HOMO[c]||c; });
    });
}
function _cleanGeniusText(t){
  t=_gTidy(String(t||'').replace(/\r\n?/g,'\n'));
  // Descripcion de Genius ("… Read More") ANTES de la primera [Seccion] → fuera. Solo antes
  // de la primera seccion: nunca recorta una letra que diga "Read More".
  var sec=t.search(/\[[^\]\n]{1,60}\]/), rm=t.indexOf('Read More');
  if(rm>=0 && (sec<0 || rm<sec)) t=t.slice(rm+9);
  // Respaldo: encabezado "N Contributors · Translations · <Titulo> Lyrics" sin descripcion.
  t=t.replace(/^\s*\d+\s*Contributors?[\s\S]*?Lyrics\s*/, function(m){ return /\[[^\]\n]{1,60}\]/.test(m)?m:''; });
  return t
          .replace(/\d*Embed\s*$/,'')                                 // contador "…Embed" final
          .replace(/\[[^\]\n]{0,60}\]/g,function(m){return '\n'+m+'\n';})
          .replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n')
          .replace(/\n{3,}/g,'\n\n').replace(/^\s+|\s+$/g,'');
}
function parseGeniusHTML(html){
  if(!html) return null;
  try{
    var doc=new DOMParser().parseFromString(html, 'text/html');

    // 1. Modern Genius: data-lyrics-container
    var nodes=doc.querySelectorAll('[data-lyrics-container="true"]');
    if(!nodes.length) nodes=doc.querySelectorAll('[class*="Lyrics__Container"]');
    if(!nodes.length) nodes=doc.querySelectorAll('.lyrics');
    if(nodes && nodes.length){
      var parts=[]; for(var i=0;i<nodes.length;i++) parts.push(_geniusNodeText(nodes[i]));
      var t=_cleanGeniusText(parts.join('\n')); if(t) return t;
    }

    // 2. JSON-LD schema (schema.org MusicRecording)
    var ldEl=doc.querySelector('script[type="application/ld+json"]');
    if(ldEl){ try{ var ld=JSON.parse(ldEl.textContent||'{}'); if(ld.lyrics&&ld.lyrics.text){ var lt=_cleanGeniusText(ld.lyrics.text); if(lt) return lt; } }catch(e){} }

    // 3. Inertia / SSR JSON embedded in <div id="app" data-page="...">
    var appEl=doc.querySelector('#app[data-page]');
    if(appEl){ try{
      var pg=JSON.parse(appEl.getAttribute('data-page')||'{}');
      var lyrObj=pg&&pg.props&&pg.props.song&&pg.props.song.lyrics_state;
      if(lyrObj&&lyrObj.body&&lyrObj.body.plain){ var pt=_cleanGeniusText(lyrObj.body.plain); if(pt) return pt; }
    }catch(e){} }

    // 4. Regex fallback: lyrics_body in JSON script
    var sm=html.match(/"lyrics_body"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if(sm){ try{ var rb=JSON.parse('"'+sm[1]+'"'); var ct=_cleanGeniusText(rb); if(ct) return ct; }catch(e){} }

    return null;
  }catch(e){ return null; }
}

// ─── UTILS ───
function fmtClock(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60); return p2(m)+':'+p2(sec); }
function fmtTimer(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+':'+p2(cs); }
function fmtTip(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+'.'+p2(cs); }
function toSRT(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60),ms=Math.floor((s%1)*1000); return p2(h)+':'+p2(m)+':'+p2(sec)+','+p3(ms); }
function p2(n){ return String(Math.floor(n)).padStart(2,'0'); }
function p3(n){ return String(n).padStart(3,'0'); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Igual que LMG: la leyenda fija (cancion actual) va DEBAJO del timer (#tChannel); los
// avisos temporales salen ARRIBA (#tStatus) y se desvanecen. Nunca el toast flotante de
// abajo (tapaba la timeline), salvo que la barra aun no exista.
// (Se declara al final del script: conserva lo que setLegend ya guardo durante el arranque.)
var _legendBase=(typeof _legendBase==='string')?_legendBase:'';
function setLegend(msg){ _legendBase=(msg||'').trim(); var c=document.getElementById('tChannel'); if(c) c.textContent=_legendBase; }
function toast(msg,ms){
  try{ if(document.documentElement.classList.contains('ae-compact')) _modMsg(msg, ms); }catch(e){}
  var st=document.getElementById('tStatus');
  if(st){ st.textContent=msg; st.classList.add('on'); clearTimeout(st._t); st._t=setTimeout(function(){ st.classList.remove('on'); st.textContent=''; }, ms||4000); return; }
  var t=document.getElementById('toast'); if(t){ t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); },ms||2200); }
}

// Pregunta rapida a la extension por la pestana de Genius abierta (no carga nada por si sola).

// ═══ ESPECTRO DE AUDIO (Verso individual, nov 2026) ═══
// 3 barras que se animan al ritmo de la cancion mientras suena. No toca la reproduccion: al cargar
// la cancion se lee el archivo aparte, se separan 3 bandas (graves / medios / agudos) con un
// OfflineAudioContext y se guarda su energia 40 veces por segundo; al reproducir, cada barra
// muestra la energia de su banda en el segundo actual. En pausa vuelven a su forma de reposo.
// Si el archivo no se puede leer, se animan suave mientras suena (nunca se rompe nada).
// Alturas en px por barra (lados / centro): nivel blanco [min,max] y fondo gris [min,max].
// El fondo sigue a la musica con un poco de retraso (lo que sono hace un instante, suavizado mas
// lento): queda un "eco" detras del nivel blanco. En reposo, la forma del diseno (7/15 y 17/27).
var SPEC_W=[[4,19],[4,29],[4,19]], SPEC_T=[[7,24],[9,34],[7,24]];
var SPEC_IDLE=[0.2,0.44,0.2], SPEC_IDLE_T=[0.59,0.72,0.59];
var _spec={els:null, trk:null, bands:null, fps:40, tok:0, src:'', raf:0, cur:SPEC_IDLE.slice(), curT:SPEC_IDLE_T.slice()};
function specInit(){
  var w=document.getElementById('modSpec'); if(!w) return;
  _spec.els=[].slice.call(w.querySelectorAll('b'));
  _spec.trk=[].slice.call(w.querySelectorAll('i'));
  specPaint();
  ['play','pause','ended','seeked','playing','waiting'].forEach(function(ev){ AEL.addEventListener(ev, specKick); });
  AEL.addEventListener('loadedmetadata', function(){ specAnalyze(AEL.currentSrc||AEL.src); });
  if(AEL.currentSrc||AEL.src) specAnalyze(AEL.currentSrc||AEL.src);
}
function specPaint(){
  if(!_spec.els) return;
  function c01(v){ return Math.max(0,Math.min(1,v||0)); }
  for(var k=0;k<_spec.els.length;k++){
    var w=SPEC_W[k]||SPEC_W[0], t=SPEC_T[k]||SPEC_T[0];
    _spec.els[k].style.height=(w[0]+c01(_spec.cur[k])*(w[1]-w[0])).toFixed(1)+'px';
    if(_spec.trk&&_spec.trk[k]) _spec.trk[k].style.height=(t[0]+c01(_spec.curT[k])*(t[1]-t[0])).toFixed(1)+'px';
  }
}
function specKick(){ if(!_spec.raf) _spec.raf=requestAnimationFrame(specFrame); }
function specFrame(){
  _spec.raf=0;
  var playing=!AEL.paused&&!AEL.ended, tgt, tgtT, k;
  if(playing){
    var b=_spec.bands, tt=AEL.currentTime||0;
    if(b){
      var i=Math.floor(tt*_spec.fps), d0=Math.floor((tt-0.12)*_spec.fps);
      tgt=[b[0][i]||0, b[1][i]||0, b[2][i]||0];
      // fondo: el pico de lo que sono entre ~0.3 s y 0.12 s antes (eco con retraso)
      tgtT=[0,0,0];
      for(k=0;k<3;k++){ for(var j=d0-7;j<=d0;j++){ var v=j>=0?(b[k][j]||0):0; if(v>tgtT[k]) tgtT[k]=v; } }
    } else {
      var t=performance.now()/1000, td=t-0.22;
      tgt=[.3+.35*Math.abs(Math.sin(t*5.1)), .4+.45*Math.abs(Math.sin(t*3.7+1)), .25+.35*Math.abs(Math.sin(t*6.3+2))];
      tgtT=[.35+.4*Math.abs(Math.sin(td*5.1)), .45+.45*Math.abs(Math.sin(td*3.7+1)), .3+.4*Math.abs(Math.sin(td*6.3+2))];
    }
  } else { tgt=SPEC_IDLE; tgtT=SPEC_IDLE_T; }
  var moving=false;
  for(k=0;k<3;k++){
    var d=tgt[k]-_spec.cur[k]; _spec.cur[k]+=d*(d>0?0.55:(playing?0.22:0.14)); if(Math.abs(d)>0.004) moving=true;
    var dt=tgtT[k]-_spec.curT[k]; _spec.curT[k]+=dt*(dt>0?0.16:(playing?0.06:0.1)); if(Math.abs(dt)>0.004) moving=true;
  }
  specPaint();
  if(playing||moving) _spec.raf=requestAnimationFrame(specFrame);
}
function specAnalyze(src){
  if(!src||src===_spec.src) return;
  _spec.src=src; _spec.bands=null; var tok=++_spec.tok;
  var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OAC) return;
  var SR=11025, x;
  function decode(buf){
    if(tok!==_spec.tok||!buf||!buf.byteLength) return;
    var dc; try{ dc=new OAC(1,1,SR); }catch(e){ return; }
    var ok=function(ab){ if(tok===_spec.tok&&ab) specBands(ab, SR, tok); }, bad=function(){};
    try{ var p=dc.decodeAudioData(buf, ok, bad); if(p&&p.catch) p.catch(bad); }catch(e){}
  }
  // Web: la cancion ya esta en memoria (File). El CSP de la pagina no deja leer blob: por XHR.
  var ch=getActive(), f=(ch&&ch.audioURL===src&&ch.audioFile)||(/^blob:/i.test(src)?audioFile:null);
  if(f&&typeof FileReader!=='undefined'){
    var fr=new FileReader(); fr.onload=function(){ decode(fr.result); }; fr.onerror=function(){};
    try{ fr.readAsArrayBuffer(f); }catch(e){} return;
  }
  if(/^blob:/i.test(src)) return;   // sin el archivo a mano: queda la animacion suave
  // AE: archivo en disco (file://)
  try{ x=new XMLHttpRequest(); x.open('GET',src,true); x.responseType='arraybuffer'; }catch(e){ return; }
  x.onload=function(){ decode(x.response); };
  x.onerror=function(){};
  try{ x.send(); }catch(e){}
}
function specBands(ab, SR, tok){
  var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  var defs=[['lowpass',180,0.7],['bandpass',900,0.6],['highpass',3500,0.7]], out=[], k=0;
  var len=Math.max(1,Math.ceil(ab.duration*SR)), hop=Math.max(1,Math.round(SR/_spec.fps));
  (function next(){
    if(tok!==_spec.tok) return;
    if(k>=defs.length){ _spec.bands=out; return; }
    var d=defs[k], oc; try{ oc=new OAC(1,len,SR); }catch(e){ return; }
    var s=oc.createBufferSource(); s.buffer=ab;
    var f=oc.createBiquadFilter(); f.type=d[0]; f.frequency.value=d[1]; f.Q.value=d[2];
    s.connect(f); f.connect(oc.destination); s.start(0);
    oc.oncomplete=function(ev){ if(tok!==_spec.tok) return; out.push(specEnv(ev.renderedBuffer.getChannelData(0), hop)); k++; setTimeout(next,0); };
    try{ var p=oc.startRendering(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
  })();
}
function specEnv(data, hop){
  var n=Math.max(1,Math.ceil(data.length/hop)), env=new Float32Array(n), i, j, s, v, a, e;
  for(i=0;i<n;i++){ s=0; a=i*hop; e=Math.min(data.length,a+hop); for(j=a;j<e;j++){ v=data[j]; s+=v*v; } env[i]=Math.sqrt(s/Math.max(1,e-a)); }
  // cada barra usa todo su recorrido: se normaliza al percentil 95 de su banda
  var sorted=Array.prototype.slice.call(env).sort(function(x,y){ return x-y; }), ref=sorted[Math.floor((n-1)*0.95)]||sorted[n-1];
  if(!(ref>0)) ref=1;
  for(i=0;i<n;i++){ v=env[i]/ref; env[i]=Math.min(1, Math.pow(v, 0.8)); }
  return env;
}
// ═══ AE compacto (nov 2026, ronda 10) ═══
// Con el panel de AE bajo (<= 260 px de alto) todo queda en UNA pildora: cancion (espectro en Verso;

// el diseno normal tal cual. Solo AE (en la web nunca se activa).
// ronda 11: botones Refresh / Thumbnail de la pildora compacta (AE) = los de la tarjeta de detalles.
var CMP_REFRESH_TITLE='Re-read the loaded song title', CMP_THUMB_TITLE='Update the thumbnail (Artist/Song text layers)';
function cmpRefresh(ev){ if(ev&&ev.stopPropagation) ev.stopPropagation(); var ch=getActive(); if(ch) channelReload(ch.id); }
function cmpThumb(ev){ if(ev&&ev.stopPropagation) ev.stopPropagation(); var ch=getActive(); if(ch) thumbnailAction(ch.id); }
var AE_COMPACT_MQ='(max-height:260px)';
function _aeCompactSet(on){
  var root=document.documentElement; on=!!on;
  if(root.classList.contains('ae-compact')===on) return;
  root.classList.toggle('ae-compact', on);
  var ms=document.getElementById('modSong');

    if(ms.classList.contains('open')) closeDetails();
    if(ms.classList.contains('gmode') && typeof closeGeniusInput==='function') closeGeniusInput();
  }
  if(!on) _modMsg('');

function _aeCompactInit(){
  if(!IN_AE || !window.matchMedia) return;
  var meta=document.getElementById('modMeta');
  if(meta && !document.getElementById('modMsg')){
    var m=document.createElement('div'); m.className='mod-msg'; m.id='modMsg';
    m.addEventListener('click', function(e){ e.stopPropagation(); _modMsg(''); });
    meta.appendChild(m);
    meta.addEventListener('focusin', function(){ _modMsg(''); });
  }
  var mq=window.matchMedia(AE_COMPACT_MQ), f=function(){ _aeCompactSet(mq.matches); };
  if(mq.addEventListener) mq.addEventListener('change', f); else if(mq.addListener) mq.addListener(f);
  window.addEventListener('resize', f);

// Aviso dentro de la pildora (en lugar de Artist/Song) por unos segundos; clic = ocultarlo.
function _modMsg(msg, ms){
  var meta=document.getElementById('modMeta'), m=document.getElementById('modMsg'); if(!meta||!m) return;
  clearTimeout(m._t);
  if(!msg){ meta.classList.remove('msg'); return; }
  if(typeof _modNav!=='undefined' && _modNav.idx>=0) return;   // pasando canales con la rueda: manda la vista previa
  m.textContent=msg; m.title=msg; meta.classList.add('msg');
  m._t=setTimeout(function(){ meta.classList.remove('msg'); }, Math.min(3500, Math.max(1500, ms||3000)));   // corto: no tapa mucho rato la cancion
}
